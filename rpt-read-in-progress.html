<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The demo is hosted on a public URL because the survey audience cannot hold
     GitHub accounts. noindex is what keeps it out of search results; see the
     hosting note in cow3rk. Deliberately NOT paired with a robots.txt Disallow:
     blocking the fetch means the crawler never reads this tag, and a URL found
     elsewhere can still be listed. Let them fetch, and tell them not to index. -->
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/fonts/fonts.css">
<link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/colors_and_type.css">
<link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/ui_kits/pronect/styles.css">
<link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/styles.css">
<link rel="stylesheet" href="pronect-demo.css">
<link rel="stylesheet" href="read-flow.css">
<style>body{margin:0;background:var(--pn-color-surface-page);font-family:var(--pn-font-family-sans)}</style>
</head>
<body>

<!-- Read Plate Tool read flow: Ready to Read, then Reading.
     ==================================================================
     Built from 118 and 119. Same frame as the CellTiter-Glo version and
     the same stylesheet, but the reading state is genuinely different:
     an estimated read time, a note that the read continues if you
     navigate away, and Cancel Read / View Results.

     That difference is the point rather than an inconsistency. A CH app
     read finishes in seconds and the app moves you on; a time course
     read can run for a day, so you need to be told you can leave.

     ?mode=timecourse comes from RPT Home's Time Course tab. Endpoint is
     the default. The two differ in the estimate and in whether Cancel
     Read is offered, per the Brain Dump. -->
<div data-screen-label="RPT Read" class="read-page">

  <div style="flex:1;display:flex;min-height:0;">

    <div id="rrip-sidebar" style="width:clamp(101px,7.5vw,284px);flex:none;align-self:stretch;display:block;"></div>

    <div style="flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;">

      <div id="rrip-topbar" style="display:block;width:100%;flex:none;"></div>

      <div class="read-body">

        <div class="read-header">
          <!-- No app-icon/back-button link: it used to point at
               rpt-home.dc.html, cut from this conversion. Just the icon now,
               not clickable. -->
          <img class="read-header__icon" src="assets/rpt-icon.svg" alt="" style="flex-shrink:0;">
          <div style="min-width:0;">
            <div class="read-header__name">Read Plate Tool</div>
            <div class="read-header__file" id="rrip-filename-1"></div>
          </div>
        </div>

        <div class="read-card">
          <h1 class="read-heading" id="rrip-heading"></h1>
          <div class="read-filename" id="rrip-filename-2"></div>

          <div class="read-art"><img id="rrip-art" src="" alt=""></div>

          <div class="read-foot">
            <div id="rrip-reading-meta" class="read-meta" style="display:none;">
              <div class="read-meta__time">Estimated Read Time: <span id="rrip-remaining"></span></div>
              <!-- The clearest cloud callout in the demo, and it is real
                   product copy rather than a note. -->
              <div class="read-meta__note">You may navigate away, your read will continue automatically.<br>Your results will appear in My Data when the read is complete.</div>
            </div>

            <div class="read-actions">
              <div id="rrip-idle-actions" style="display:flex;gap:inherit;">
                <!-- Cancel used to link to rpt-home.dc.html, also cut. Sends
                     back to the guided RPT home instead. -->
                <a class="read-btn read-btn--ghost" href="rpt-guided-home.html">Cancel</a>
                <button class="read-btn read-btn--primary demo-cue" id="rrip-start-btn">Start</button>
              </div>
              <div id="rrip-reading-actions" style="display:none;gap:inherit;">
                <button type="button" class="read-btn read-btn--ghost rrip-hover" data-note="Cancel Read cancels any reads still to come. Reads already completed are saved to My Data.">Cancel Read</button>
                <a class="read-btn read-btn--primary" id="rrip-view-results-link" href="#">View Results</a>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="pronect-sidebar.js"></script>
<script src="pronect-topbar.js"></script>
<script>
  mountPronectSidebar(document.getElementById('rrip-sidebar'), { dashboardHref: 'user-dashboard.html' });
  mountPronectTopbar(document.getElementById('rrip-topbar'));

  // ---- shared hover-note tooltip ----
  let noteEl = null;
  function showNote(e) {
    const note = e.currentTarget.dataset.note;
    if (!note) return;
    if (!noteEl) {
      noteEl = document.createElement('div');
      noteEl.style.cssText = 'position:fixed;background:var(--pn-color-neutral-900);color:var(--pn-color-text-inverse);font:500 var(--pn-font-size-xs)/1.3 var(--font-sans);padding:8px 12px;border-radius:8px;pointer-events:none;z-index:2000;box-shadow:var(--pn-shadow-xs);max-width:220px;';
      document.body.appendChild(noteEl);
    }
    noteEl.textContent = note;
    noteEl.style.left = (e.clientX + 14) + 'px';
    noteEl.style.top = (e.clientY + 18) + 'px';
  }
  function moveNote(e) {
    if (!noteEl) return;
    noteEl.style.left = (e.clientX + 14) + 'px';
    noteEl.style.top = (e.clientY + 18) + 'px';
  }
  function hideNote() { if (noteEl) { noteEl.remove(); noteEl = null; } }
  document.querySelectorAll('.rrip-hover').forEach((el) => {
    el.addEventListener('mouseenter', showNote);
    el.addEventListener('mousemove', moveNote);
    el.addEventListener('mouseleave', hideNote);
  });

  function isTimeCourse() {
    return new URLSearchParams(window.location.search).get('mode') === 'timecourse';
  }

  // Read Plate Tool files carry no read-type suffix, unlike a CH app's
  // "- Full Plate" or "- Analysis". Confirmed against 118 and 119.
  function stampFileName() {
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    let h = d.getHours();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return 'Read Plate Tool ' + d.getFullYear() + ' ' + p(d.getMonth() + 1) + ' ' + p(d.getDate())
      + ' ' + h + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + ' ' + ap;
  }
  function fmtTime(total) {
    if (!Number.isFinite(total) || total < 0) return '00:00:00';
    const p = (n) => String(n).padStart(2, '0');
    return p(Math.floor(total / 3600)) + ':' + p(Math.floor((total % 3600) / 60)) + ':' + p(total % 60);
  }

  const fileName = stampFileName();
  document.getElementById('rrip-filename-1').textContent = fileName;
  document.getElementById('rrip-filename-2').textContent = fileName;

  let reading = false;
  let remainingSec = null;
  let tickTimer = null;

  function render() {
    document.getElementById('rrip-heading').textContent = reading ? 'Reading…' : 'Insert plate to start reading.';
    document.getElementById('rrip-art').src = reading ? 'assets/reading-myglo.gif' : 'assets/ready-to-read-myglo.png';
    document.getElementById('rrip-reading-meta').style.display = reading ? 'block' : 'none';
    document.getElementById('rrip-idle-actions').style.display = reading ? 'none' : 'flex';
    document.getElementById('rrip-reading-actions').style.display = reading ? 'flex' : 'none';
    if (reading) {
      document.getElementById('rrip-remaining').textContent = fmtTime(remainingSec);
      const tc = isTimeCourse();
      document.getElementById('rrip-view-results-link').href = 'rpt-results.html' + (tc ? '?mode=timecourse&progress=6' : '');
    }
  }

  // An endpoint read is seconds; a time course runs the real protocol shown on
  // RPT Home's guided page: 5 min between reads, 12 reads plus timepoint 0, so
  // 60 minutes total. The countdown is real rather than a static label.
  function startRead() {
    const total = isTimeCourse() ? (60 * 60 - 3) : 12;
    reading = true;
    remainingSec = total;
    render();
    tickTimer = setInterval(() => {
      remainingSec = Math.max(0, remainingSec - 1);
      if (remainingSec <= 0) clearInterval(tickTimer);
      render();
    }, 1000);
  }
  document.getElementById('rrip-start-btn').addEventListener('click', startRead);

  // ?running=1 skips Ready to Read and enters mid-read. That is how the
  // instrument details page links here: the reader is already running, so
  // asking the user to press Start would be asking them to start something
  // that is already going.
  if (new URLSearchParams(window.location.search).get('running') === '1') startRead();
  render();
</script>
</body>
</html>
