<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The demo is hosted on a public URL because the survey audience cannot hold
     GitHub accounts. noindex is what keeps it out of search results; see the
     hosting note in cow3rk. Deliberately NOT paired with a robots.txt Disallow:
     blocking the fetch means the crawler never reads this tag, and a URL found
     elsewhere can still be listed. Let them fetch, and tell them not to index. -->
<meta name="robots" content="noindex, nofollow">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/colors_and_type.css">
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/styles.css">
  <link rel="stylesheet" href="pronect-demo.css">
  <script src="ctg-demo-data.js"></script>
  <style>body{margin:0;background:transparent}</style>
</helmet>

<!-- Select Instrument, as reached from the Plate Map Editor's Next.
     ================================================================
     This is the second place the instrument table appears; the first is step two
     of the Read Plate modal inside ctg-app-home. Extracting on second use is the
     project's rule, so it lives here.

     ctg-app-home has NOT been moved onto this component yet. Its copy is step
     two of a tabbed, two-step flow with its own Back button, so adopting this
     means reworking a flow that currently works, which is its own change. Until
     then the instrument list is defined twice and the two must be kept in step;
     that is recorded as a to-do rather than left to be discovered.

     dc-import cannot pass callbacks, so this component owns what happens next:
     Next navigates on its own, and Cancel announces itself on the document as
     `ctg:select-instrument-cancel` for the host page to close. Same constraint
     and same workaround as the Luc editor's Configure Your Assay modal. -->
<sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
  <div style="position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div style="background:var(--pn-color-surface-default);border-radius:var(--pn-border-radius-lg);width:1200px;max-width:100%;height:760px;max-height:100%;box-shadow:var(--pn-shadow-3);display:flex;flex-direction:column;padding:32px 40px;font-family:var(--pn-font-family-sans);">

      <h2 style="margin:0 0 16px;font:600 24px/1.2 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">Select Instrument</h2>

      <!-- The validation note. The product runs a real plate map check before the
           read; this demo does not implement the rules, it states that the check
           happens and why it is worth having. Cate's framing: for a survey demo
           the point is to show the feature, not to make a respondent build a
           valid plate map from scratch.
           COPY IS MINE AND UNREVIEWED. -->
      <div style="display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:var(--pn-border-radius-md);background:var(--pn-color-status-success-surface);border:1px solid var(--pn-color-status-success-border);flex:none;margin-bottom:8px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--pn-color-status-success-border)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px;"><path d="M20 6L9 17l-5-5"/></svg>
        <span style="font:400 14px/1.45 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">ProNect checks the plate map before a read starts, so an issue surfaces here rather than after the data is collected. This demo's plate map has no errors to show.</span>
      </div>

      <div style="display:flex;align-items:center;gap:24px;padding:20px 0;flex:none;">
        <span style="font:500 15px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);flex:none;">Analysis Results Name</span>
        <span style="flex:1;font:400 15px/1 var(--pn-font-family-sans);color:var(--pn-color-text-muted);overflow-wrap:anywhere;">{{ analysisName }}</span>
        <button data-note="The analysis name can be edited before the read starts."
                onMouseEnter="{{ showNote }}" onMouseMove="{{ moveNote }}" onMouseLeave="{{ hideNote }}"
                style="flex:none;background:var(--pn-color-surface-default);border:1px solid var(--pn-color-border-default);border-radius:var(--pn-border-radius-md);padding:8px 12px;cursor:not-allowed;font:400 15px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">Rename</button>
      </div>

      <!-- Shared with the Read Plate modal on ctg-app-home; see the note in
           ctg-instrument-table. Controlled: selectedId down, pick back up on
           the document. -->
      <dc-import name="ctg-instrument-table"
                  selected-id="{{ selectedId }}"
                  hint-size="1120,420"
                  style="width:100%;flex:1;min-height:0;"></dc-import>

      <div style="display:flex;justify-content:center;gap:16px;padding-top:24px;flex:none;">
        <button onClick="{{ onCancel }}" style="background:var(--pn-color-surface-default);border:1px solid var(--pn-color-border-default);border-radius:var(--pn-border-radius-md);padding:8px 12px;cursor:pointer;font:400 15px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">Cancel</button>
        <button onClick="{{ onNext }}" disabled="{{ nextDisabled }}" style="{{ nextStyle }}">Next</button>
      </div>
    </div>
  </div>
</sc-if>

<sc-if value="{{ note }}">
  <div style="position:fixed;left:{{ noteX }};top:{{ noteY }};background:var(--pn-color-neutral-900);color:var(--pn-color-text-inverse);font:500 12px/1.3 var(--pn-font-family-sans);padding:6px 10px;border-radius:6px;pointer-events:none;z-index:2200;box-shadow:var(--pn-shadow-xs);max-width:220px;">{{ note }}</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1600, &quot;height&quot;: 900},
  &quot;open&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;section&quot;: &quot;State&quot;, &quot;tsType&quot;: &quot;boolean&quot; },
  &quot;destination&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;ctg-read-in-progress.dc.html?from=platemap&quot;, &quot;section&quot;: &quot;Navigation&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
// Shared with the app home's Read Plate modal via ctg-demo-data.js, so the two
// screens cannot disagree about which readers exist or what state they are in.
//
// Read lazily, inside renderVals, NOT as a top-level const. dc-runtime evaluates
// an imported component's logic class before that component's own helmet scripts
// have loaded, so a top-level `window.CTG.INSTRUMENTS` throws on undefined and
// the whole class eval fails; the runtime then falls back to rendering the
// template from props alone, which looks like an empty table rather than an
// error. The host page loads ctg-demo-data.js too, so by the time renderVals
// runs the data is there.

class Component extends DCLogic {
  state = {
    note: null, noteX: 0, noteY: 0,
    selectedId: null,
    // Stamped once, when the modal first opens, rather than on every render: a
    // name that ticks its own seconds while you are looking at it reads as a bug.
    analysisName: null,
    integrationInvalid: false,
  };

  showNote = (e) => {
    const note = e.currentTarget.dataset.note;
    if (!note) return;
    this.setState({ note, noteX: e.clientX + 14, noteY: e.clientY + 18 });
  };
  moveNote = (e) => {
    if (!this.state.note) return;
    this.setState({ noteX: e.clientX + 14, noteY: e.clientY + 18 });
  };
  hideNote = () => this.setState({ note: null });

  componentDidMount() {
    // The shared instrument table is a dc-import and cannot call back into this
    // component, so a pick arrives on the document. Same contract this component
    // already uses upward, to announce Cancel to its own parent.
    this._onPick = (e) => this.setState({ selectedId: ((e && e.detail) || {}).id || null });
    document.addEventListener('ctg:instrument-pick', this._onPick);
    this._onValidity = (e) => this.setState({ integrationInvalid: !!((e && e.detail) || {}).invalid });
    document.addEventListener('ctg:integration-validity', this._onValidity);
  }
  componentWillUnmount() {
    document.removeEventListener('ctg:instrument-pick', this._onPick);
    document.removeEventListener('ctg:integration-validity', this._onValidity);
  }

  // Same shape as the read file name, but it names the analysis the read will
  // produce rather than the read itself.
  _stamp() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    let h = d.getHours();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return 'CellTiter-Glo ' + d.getFullYear() + ' ' + p(d.getMonth() + 1) + ' ' + p(d.getDate())
         + ' ' + h + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + ' ' + ap + ' - Analysis';
  }

  renderVals() {
    const open = this.props.open !== false;
    if (open && !this.state.analysisName) {
      // Deferred so it does not run during render.
      setTimeout(() => this.setState({ analysisName: this._stamp() }), 0);
    }
    // Matches prod: auto-select the reader if there's only one selectable one,
    // or the first in the list if there's more than one. Same deferral as the
    // analysis name, and the same one-shot guard via _defaulted.
    if (open && !this.state.selectedId && !this._defaulted) {
      this._defaulted = true;
      const found = (window.CTG.INSTRUMENTS || []).find(i => i.selectable);
      if (found) setTimeout(() => this.setState({ selectedId: found.id }), 0);
    }

    const canNext = !!this.state.selectedId && !this.state.integrationInvalid;
    return {
      open,
      selectedId: this.state.selectedId || '',
      analysisName: this.state.analysisName || '',
      note: this.state.note, noteX: this.state.noteX + 'px', noteY: this.state.noteY + 'px',
      nextDisabled: !canNext,
      nextStyle: `border:1px solid ${canNext ? 'var(--pn-color-sol-500)' : 'var(--pn-color-border-subtle)'};background:${canNext ? 'var(--pn-color-sol-500)' : 'var(--pn-color-surface-sunken)'};color:${canNext ? 'var(--pn-color-text-primary)' : 'var(--pn-color-text-disabled)'};border-radius:var(--pn-border-radius-md);padding:8px 12px;font:400 15px/1 var(--pn-font-family-sans);cursor:${canNext ? 'pointer' : 'default'};`,
      // Announced on the document because dc-import cannot pass a callback down.
      onCancel: () => document.dispatchEvent(new CustomEvent('ctg:select-instrument-cancel')),
      onNext: () => {
        if (!canNext) return;
        window.location.href = this.props.destination || 'ctg-read-in-progress.dc.html?from=platemap';
      },
    };
  }
}
</script>
</body>
</html>
