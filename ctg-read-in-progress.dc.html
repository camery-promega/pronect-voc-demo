<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The demo is hosted on a public URL because the survey audience cannot hold
     GitHub accounts. noindex is what keeps it out of search results; see the
     hosting note in cow3rk. Deliberately NOT paired with a robots.txt Disallow:
     blocking the fetch means the crawler never reads this tag, and a URL found
     elsewhere can still be listed. Let them fetch, and tell them not to index. -->
<meta name="robots" content="noindex, nofollow">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/colors_and_type.css">
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/ui_kits/pronect/styles.css">
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/styles.css">
  <link rel="stylesheet" href="pronect-demo.css">
  <link rel="stylesheet" href="read-flow.css">
  <script src="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/_ds_bundle.js"></script>
  <style>body{margin:0;background:var(--pn-color-surface-page);font-family:var(--pn-font-family-sans)}</style>
</helmet>

<!-- CellTiter-Glo read flow: Ready to Read, then Reading.
     ==================================================================
     Two states of one screen, built from 117 and 120. The frame is
     identical in both; only the heading and what sits under the artwork
     change.

     Revised 2026-09-16: this used to auto-navigate 2.5s after Start, with no
     controls while reading at all (120 has none, and a CH app read is short
     enough that the app can just move you on). Cate's call: an unannounced
     page change reads badly if the viewer is mid-thought, so this now shows
     an estimated-time countdown (same real ticking countdown as the Read
     Plate Tool version, just much shorter) and a pulsing Next button once it
     reaches zero, rather than leaving. Nothing moves you on automatically
     anymore, on either app's version of this screen. -->

<div data-screen-label="CTG Read" class="read-page">

  <div style="display:none;background:var(--pn-color-neutral-900);color:var(--pn-color-text-inverse);padding:8px 24px;font-size:13px;letter-spacing:.02em">Demo guide - {{ guideText }}</div>

  <div style="flex:1;display:flex;min-height:0;">

    <dc-import name="pronect-sidebar"
                dashboard-href="user-dashboard.dc.html"
                hint-size="284,900"
                style="width:clamp(101px,7.5vw,284px);flex:none;align-self:stretch;display:block;"></dc-import>

    <div style="flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;">

      <dc-import name="pronect-topbar"
                  hint-size="1200,64"
                  style="display:block;width:100%;flex:none;"></dc-import>

      <div class="read-body">

        <div class="read-header">
          <a href="ctg-app-home.dc.html" style="display:block;flex-shrink:0;">
            <img class="read-header__icon" src="assets/app-icon_ctg.svg" alt="">
          </a>
          <div style="min-width:0;">
            <div class="read-header__name">CellTiter-Glo</div>
            <div class="read-header__file">{{ fileName }}</div>
          </div>
        </div>

        <div class="read-card">
          <h1 class="read-heading">{{ heading }}</h1>
          <div class="read-filename">{{ fileName }}</div>

          <div class="read-art">
            <img src="{{ artSrc }}" alt="">
          </div>

          <sc-if value="{{ isIdle }}" hint-placeholder-val="{{ true }}">
            <div class="read-foot">
              <div class="read-actions">
                <a class="read-btn read-btn--ghost" href="ctg-app-home.dc.html">Cancel</a>
                <button class="read-btn read-btn--primary" onClick="{{ startRead }}">Start</button>
              </div>
            </div>
          </sc-if>

          <!-- Reading: an estimated-time countdown (real, same mechanism as
               the Read Plate Tool version), with a tooltip on the time itself
               explaining it's simulated - not a caveat repeated elsewhere,
               since nothing else on this screen says so. Next only appears
               once the countdown reaches zero, and nothing navigates until
               it's clicked. -->
          <sc-if value="{{ isReading }}" hint-placeholder-val="{{ false }}">
            <div class="read-foot">
              <div class="read-meta">
                <div class="read-meta__time" data-note="This is a simulated read. A real MyGlo read takes as long as the plate and assay require." onMouseEnter="{{ showNote }}" onMouseMove="{{ moveNote }}" onMouseLeave="{{ hideNote }}" style="cursor:help;">Estimated Read Time: {{ remaining }}</div>
              </div>
              <sc-if value="{{ readComplete }}" hint-placeholder-val="{{ false }}">
                <div class="read-actions">
                  <button class="read-btn read-btn--primary demo-cue" onClick="{{ onNext }}">Next</button>
                </div>
              </sc-if>
            </div>
          </sc-if>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Floating tooltip, same pattern/style as user-dashboard.dc.html. -->
<sc-if value="{{ note }}">
  <div style="position:fixed;left:{{ noteX }};top:{{ noteY }};background:var(--pn-color-neutral-900);color:var(--pn-color-text-inverse);font:500 var(--pn-font-size-xs)/1.3 var(--font-sans);padding:8px 12px;border-radius:8px;pointer-events:none;z-index:2000;box-shadow:var(--pn-shadow-xs);max-width:220px;">{{ note }}</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { reading: false, fileName: null, remainingSec: null, note: null, noteX: 0, noteY: 0 };

  // Floating tooltip, same implementation as user-dashboard.dc.html.
  showNote = (e) => {
    const note = e.currentTarget.dataset.note;
    if (!note) return;
    this.setState({ note, noteX: e.clientX + 14, noteY: e.clientY + 18 });
  };
  moveNote = (e) => {
    if (!this.state.note) return;
    this.setState({ noteX: e.clientX + 14, noteY: e.clientY + 18 });
  };
  hideNote = () => this.setState({ note: null });

  // The same read screen serves both CellTiter-Glo read workflows; only the
  // destination differs. A full-plate read yields instrument data, so it ends on
  // the heat map. A read against a plate map can be analysed straight away, so it
  // ends on the analysis. from=platemap is set by whichever screen started it.
  _fromPlateMap() {
    return new URLSearchParams(window.location.search).get('from') === 'platemap';
  }

  // Both the label and the suffix follow the same branch the destination does.
  // Stamped once on mount rather than on every render: a name that ticks its own
  // seconds while you watch reads as a bug.
  _stamp() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    let h = d.getHours();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return 'CellTiter-Glo ' + d.getFullYear() + ' ' + p(d.getMonth() + 1) + ' ' + p(d.getDate())
         + ' ' + h + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + ' ' + ap
         + (this._fromPlateMap() ? ' - Analysis' : ' - Full Plate');
  }

  componentDidMount() { this.setState({ fileName: this._stamp() }); }
  componentWillUnmount() { if (this._tick) clearInterval(this._tick); }

  // 30s stands in for the read - a real countdown, same mechanism as the Read
  // Plate Tool version, just much shorter. Reaching zero no longer navigates
  // by itself; it reveals Next instead, per Cate's ask not to move the
  // viewer to a new page without warning.
  startRead = () => {
    this.setState({ reading: true, remainingSec: 30 });
    this._tick = setInterval(() => {
      this.setState(s => {
        if (s.remainingSec <= 1) { clearInterval(this._tick); return { remainingSec: 0 }; }
        return { remainingSec: s.remainingSec - 1 };
      });
    }, 1000);
  };

  onNext = () => {
    const dest = this._fromPlateMap() ? 'ctg-analysis-results.dc.html' : 'ctg-read-results.dc.html';
    window.location.href = dest;
  };

  renderVals() {
    const s = this.state;
    const reading = s.reading;
    const readComplete = reading && s.remainingSec <= 0;
    return {
      fileName: s.fileName || '',
      isIdle: !reading,
      isReading: reading,
      readComplete,
      heading: reading ? 'Reading…' : 'Insert plate to start reading.',
      // A still for the idle state, the animated GIF once the read is running.
      artSrc: reading ? 'assets/reading-myglo.gif' : 'assets/ready-to-read-myglo.png',
      remaining: Number.isFinite(s.remainingSec) ? `${s.remainingSec} sec` : '',
      startRead: this.startRead,
      onNext: this.onNext,
      guideText: reading
        ? 'Reading. A pulsing Next button appears once the countdown ends, going to ' + (this._fromPlateMap() ? 'Analysis Results' : 'Read Results') + '.'
        : 'Ready to Read. Press Start to begin the read.',

      note: s.note, noteX: s.noteX + 'px', noteY: s.noteY + 'px',
      showNote: this.showNote, moveNote: this.moveNote, hideNote: this.hideNote,
    };
  }
}
</script>
</body>
</html>
