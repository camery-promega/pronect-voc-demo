<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The demo is hosted on a public URL because the survey audience cannot hold
     GitHub accounts. noindex is what keeps it out of search results; see the
     hosting note in cow3rk. Deliberately NOT paired with a robots.txt Disallow:
     blocking the fetch means the crawler never reads this tag, and a URL found
     elsewhere can still be listed. Let them fetch, and tell them not to index. -->
<meta name="robots" content="noindex, nofollow">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/colors_and_type.css">
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/styles.css">
  <link rel="stylesheet" href="pronect-demo.css">
  <style>
    body{margin:0;font-family:var(--pn-font-family-sans);}
    .ix-link{display:block;text-decoration:none;border:1px solid var(--pn-color-border-subtle);
      border-radius:var(--pn-border-radius-md);padding:14px 18px;background:#fff;}
    .ix-link:hover{background:var(--pn-color-surface-hover);border-color:var(--pn-color-border-default);}
  </style>
</helmet>

<!-- Entry point. Reorganized 2026-09-16 per Stephanie's China-branch review
     feedback (see Screen Review Checklist.md): the flat "every screen" list
     didn't give a first-time viewer any sense of where to start, so this is
     now grouped as Dashboards, then a CellTiter-Glo workflow starting at
     Create Plate Map, then a Read Plate Tool workflow starting at RPT Home -
     each workflow leads with its guided first step rather than the app's
     general home screen. The old flat list with review-status tags didn't
     disappear, it moved to review-status.dc.html (not linked from the demo
     chrome, reach it by URL).

     DELIBERATELY OUTSIDE THE PRODUCT CHROME. No sidebar, no top bar. Putting a
     launcher inside ProNect's chrome would assert that ProNect has one, and it
     does not; a respondent would reasonably read it as a real screen. This
     reads as scaffolding around the demo instead, which is what it is.

     Card descriptions describe the functionality and what to expect, per
     the checklist's "Demo Guidance" task - no longer placeholders. -->
<div style="min-height:100vh;background:var(--pn-color-surface-page);padding:48px 32px;box-sizing:border-box;">
  <div style="max-width:1080px;margin:0 auto;">

    <p style="margin:0 0 8px;font:500 13px/1 var(--pn-font-family-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--pn-color-text-muted);">Demo</p>
    <h1 style="margin:0 0 6px;font:600 32px/1.2 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">ProNect</h1>
    <p style="margin:0 0 36px;font:400 16px/1.5 var(--pn-font-family-sans);color:var(--pn-color-text-muted);max-width:60ch;">
      A guided path through the demo. Start with the dashboards, then walk through the CellTiter-Glo and Read Plate Tool workflows.
    </p>

    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
      <div style="margin-bottom:34px;">
        <h2 style="margin:0 0 4px;font:600 18px/1.3 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">{{ g.title }}</h2>
        <p style="margin:0 0 14px;font:400 14px/1.4 var(--pn-font-family-sans);color:var(--pn-color-text-muted);">{{ g.blurb }}</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;">
          <sc-for list="{{ g.links }}" as="l" hint-placeholder-count="3">
            <a class="ix-link" href="{{ l.href }}">
              <span style="display:block;font:500 15px/1.3 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">{{ l.name }}</span>
              <span style="display:block;margin-top:3px;font:400 13px/1.4 var(--pn-font-family-sans);color:var(--pn-color-text-muted);">{{ l.note }}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:900}}">
// Declared here rather than in ctg-demo-data.js: this is a list of screens, not
// demo content, and nothing else needs it. Move it out if a second screen ever
// wants the same list.
//
// Grouping and order per Stephanie's China-branch feedback, 2026-09-16: each
// workflow leads with its guided first step (Create Plate Map for CTG, RPT
// Home for RPT) rather than the app's general home screen. Cate is defining
// the exact steps/screens for each workflow in the checklist doc - this is a
// starting point, not final.
const GROUPS = [
  {
    title: 'Dashboards',
    blurb: 'The platform, above any one app.',
    links: [
      { name: 'Dashboard', href: 'user-dashboard.dc.html',
        note: 'Every connected instrument and your saved plate maps, reads, and analyses, all on one screen.' },
      { name: 'Instrument details', href: 'instrument-details.dc.html',
        note: "One instrument's full record - status, connected files, and live telemetry." },
    ],
  },
  {
    title: 'CellTiter-Glo workflow',
    blurb: 'Build a plate map, read it, see the analysis.',
    links: [
      { name: 'Create Plate Map', href: 'ctg-guided-plate-map.dc.html',
        note: 'Start here. A plate map tells CellTiter-Glo which wells hold samples, controls, and standards - click any well to see what it holds.' },
      { name: 'Read in progress, from a plate map', href: 'ctg-read-in-progress.dc.html?from=platemap',
        note: 'The read runs against the plate map you just saw, then opens directly into its analysis.' },
      { name: 'Analysis results', href: 'ctg-analysis-results.dc.html',
        note: 'The finished analysis - curve fit, error bars, and every data point behind it.' },
    ],
  },
  {
    title: 'Read Plate Tool workflow',
    blurb: 'Select wells, run a time course, see the results.',
    links: [
      { name: 'App home', href: 'rpt-guided-home.dc.html',
        note: 'Start here. Select which wells to read, then choose a Time Course to collect data over multiple reads.' },
      { name: 'Read in progress, time course', href: 'rpt-read-in-progress.dc.html?mode=timecourse&running=1',
        note: 'A time course read in progress, collecting data at set intervals until it finishes.' },
      { name: 'Results, time course', href: 'rpt-results.dc.html?mode=timecourse',
        note: 'All 13 reads complete, laid out read by read.' },
    ],
  },
];

class Component extends DCLogic {
  renderVals() {
    return { groups: GROUPS };
  }

  // Same Foleon "Dynamic height" resize report as pronect-topbar.dc.html - this
  // page has no topbar to inherit it from, being deliberately outside the
  // product chrome, so it needs its own copy. Keep both in sync if the reporting
  // logic ever changes.
  componentDidMount() {
    let lastHeight = 0;
    this._reportHeight = () => {
      const h = document.documentElement.scrollHeight;
      if (h === lastHeight) return;
      lastHeight = h;
      window.parent.postMessage(
        JSON.stringify({ src: location.toString(), context: 'iframe.resize', height: h }),
        '*'
      );
    };
    this._resizeObserver = new ResizeObserver(this._reportHeight);
    this._resizeObserver.observe(document.documentElement);
  }
  componentWillUnmount() {
    if (this._resizeObserver) this._resizeObserver.disconnect();
  }
}
</script>
</body>
</html>
