<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The demo is hosted on a public URL because the survey audience cannot hold
     GitHub accounts. noindex is what keeps it out of search results; see the
     hosting note in cow3rk. Deliberately NOT paired with a robots.txt Disallow:
     blocking the fetch means the crawler never reads this tag, and a URL found
     elsewhere can still be listed. Let them fetch, and tell them not to index. -->
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/fonts/fonts.css">
<link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/colors_and_type.css">
<link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/ui_kits/pronect/styles.css">
<link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/styles.css">
<link rel="stylesheet" href="pronect-demo.css">
<link rel="stylesheet" href="ctg-plate-map-editor.css">
<script src="ctg-demo-data.js"></script>
<style>
  body { margin:0; background:var(--pn-color-surface-page); }
  /* Looks like a normal .field-input, but is a div, not an input - so it
     can never take focus, show a caret, or be typed into. White background
     and regular text color on purpose: Cate didn't want these reading as
     *disabled* fields, just as plain, non-interactive ones. Box-sizing and
     height match .field-input exactly so the well wizard's layout doesn't
     shift; the box-sizing itself is redundant with pronect-demo.css's
     universal border-box, kept here for clarity since this rule's whole
     job is imitating a form control. */
  .field-input--display {
    box-sizing: border-box; display: flex; align-items: center;
    background: var(--pn-color-surface-default);
    color: var(--pn-color-text-primary);
    cursor: default; user-select: none;
  }
</style>
</head>
<body>

<!-- Guided, view-only companion to the real (cut) plate map editor.
     ==========================================================================
     Built 2026-09-16 per Cate's ask, then revised twice the same day: first to
     restore the full header (analysis type dropdown, Assay Note, Open Plate
     Map, Save, Save As - the first cut stripped these down and it read as
     broken/incomplete next to the real product), then to match this demo's
     floating-tooltip convention instead of the real editor's click-to-dialog
     one, and to move the walkthrough copy into a collapsible bar at the very
     top of the page that overlays rather than pushing content down.

     Only the plate itself is simplified: no drag-select, no per-well editing.
     Clicking a well still shows its type and values in the Well Wizard, just
     as disabled/read-only fields.

     The fully interactive real editor (ctg-create-plate-map.dc.html) was cut
     from this static-microsite conversion along with the rest of the
     Claude-Design-only tooling pages; see git history if it's ever needed
     again. -->
<div style="min-height:100vh;display:flex;flex-direction:column;font-family:var(--pn-font-family-sans)">

  <!-- Walkthrough guide copy. Sits above everything else, including the
       sidebar/topbar row. position:relative/absolute so expanding it overlays
       the page instead of pushing the plate down - collapsing and expanding
       never changes the page's height. Styled like this demo's floating note
       tooltip (dark, same font/radius family) per Cate's ask. -->
  <div style="position:relative;flex:none;z-index:600;">
    <button id="gpm-about-toggle" style="all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;background:var(--pn-color-neutral-900);color:var(--pn-color-text-inverse);padding:8px 24px;font:500 13px/1.3 var(--pn-font-family-sans);letter-spacing:.02em;cursor:pointer;">
      <svg id="gpm-about-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transition:transform .15s;flex-shrink:0;"><polyline points="6 9 12 15 18 9"></polyline></svg>
      About this screen
    </button>
    <div id="gpm-about-panel" style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--pn-color-neutral-900);color:var(--pn-color-text-inverse);padding:12px 24px;font:400 13px/1.5 var(--pn-font-family-sans);box-shadow:var(--pn-shadow-2);">
      A plate map tells CellTiter-Glo which wells hold samples, controls, and standards, so a read's raw signal can be turned into results. This plate map is already filled in for a dose-response assay. Click any well to see what it holds.
    </div>
  </div>

  <div style="flex:1;display:flex;min-height:0;">

    <div id="gpm-sidebar" style="width:clamp(101px,7.5vw,284px);flex:none;align-self:stretch;display:block;"></div>

    <div style="flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;">

      <div id="gpm-topbar" style="display:block;width:100%;flex:none;"></div>

      <div class="editor-wrap">

        <!-- Page header -->
        <div class="page-header">
          <div class="app-identity">
            <!-- No app-icon link: it used to point at ctg-app-home.dc.html,
                 cut from this conversion. Just the icon now, not clickable. -->
            <div class="app-icon-wrap"><img src="assets/app-icon_ctg.svg" alt=""></div>
            <div style="min-width:0;">
              <div class="app-name">CellTiter-Glo</div>
              <div class="app-platename">
                <span id="gpm-plate-name"></span>
                <svg class="gpm-hover" data-note="Rename changes the name of this plate map." style="cursor:not-allowed;" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--pn-color-text-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h11M4 11h7M4 16h7M14 19l5-5 2 2-5 5h-2z"/></svg>
              </div>
            </div>
          </div>

          <!-- Analysis type. Dose Response is selected and functional; hovering
               Single Concentration or Linearity Analysis shows a floating
               tooltip instead of the real editor's click-to-reveal inline note. -->
          <div style="position:relative;margin-left:var(--pn-spacing-24);" data-dropdown="analysis">
            <div class="header-select" id="gpm-analysis-toggle">
              <span>Dose Response</span>
              <svg id="gpm-analysis-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--pn-color-text-muted);transition:transform .15s;flex-shrink:0"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div id="gpm-analysis-menu" class="ww-menu" style="display:none;top:44px;"></div>
          </div>

          <!-- Assay Note/Open Plate Map/Save/Save As are all floating-tooltip
               demo notes, same pattern as the user dashboard - not
               click-to-dialog, and Open Plate Map no longer opens a real
               picker modal. -->
          <div class="header-actions" style="margin-left:var(--pn-spacing-12);">
            <button class="btn btn-outline gpm-hover" data-note="Assay Note records notes against this assay and saves them with the plate map." style="cursor:not-allowed;">Assay Note</button>
            <button class="btn btn-outline gpm-hover" data-note="Open Plate Map loads a previously saved plate map into the editor." style="cursor:not-allowed;">Open Plate Map</button>
          </div>

          <span style="flex:1"></span>

          <div class="header-actions">
            <button class="btn btn-outline gpm-hover" data-note="Save writes the plate map to your ProNect account, where it is available from any device you sign in from." style="cursor:not-allowed;">Save</button>
            <button class="btn btn-outline gpm-hover" data-note="Save As stores the plate map under a new name and leaves the original unchanged." style="cursor:not-allowed;">Save As</button>
          </div>
        </div>

        <!-- Plate + Well Wizard, together on one white card over the page
             background, same layout as the real editor. -->
        <div class="editor-card">
        <div class="plate-row">

          <div class="plate-area" id="gpm-plate-area"></div>

          <div class="wizard-col">
            <div class="control-panel">
              <div class="control-panel__body" id="gpm-wizard-body" style="flex:none;"></div>
              <div class="panel-footer">
                <button class="btn-next demo-cue" id="gpm-next-btn">Next</button>
              </div>
            </div>
          </div>

        </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Select Instrument modal host. -->
<div id="gpm-select-instrument" style="position:fixed;inset:0;width:100%;height:100%;z-index:2100;"></div>

<script src="pronect-sidebar.js"></script>
<script src="pronect-topbar.js"></script>
<script src="ctg-instrument-table.js"></script>
<script src="ctg-select-instrument.js"></script>
<script>
  mountPronectSidebar(document.getElementById('gpm-sidebar'), { dashboardHref: 'user-dashboard.html' });
  mountPronectTopbar(document.getElementById('gpm-topbar'));

  // ---- shared hover-note tooltip ----
  let noteEl = null;
  function showNote(e) {
    const note = e.currentTarget.dataset.note;
    if (!note) return;
    if (!noteEl) {
      noteEl = document.createElement('div');
      noteEl.style.cssText = 'position:fixed;background:var(--pn-color-neutral-900);color:var(--pn-color-text-inverse);font:500 var(--pn-font-size-xs)/1.3 var(--font-sans);padding:8px 12px;border-radius:8px;pointer-events:none;z-index:2000;box-shadow:var(--pn-shadow-xs);max-width:220px;';
      document.body.appendChild(noteEl);
    }
    noteEl.textContent = note;
    noteEl.style.left = (e.clientX + 14) + 'px';
    noteEl.style.top = (e.clientY + 18) + 'px';
  }
  function moveNote(e) {
    if (!noteEl) return;
    noteEl.style.left = (e.clientX + 14) + 'px';
    noteEl.style.top = (e.clientY + 18) + 'px';
  }
  function hideNote() {
    if (noteEl) { noteEl.remove(); noteEl = null; }
  }
  document.querySelectorAll('.gpm-hover').forEach((el) => {
    el.addEventListener('mouseenter', showNote);
    el.addEventListener('mousemove', moveNote);
    el.addEventListener('mouseleave', hideNote);
  });

  // ---- About this screen ----
  let aboutOpen = false;
  const aboutPanel = document.getElementById('gpm-about-panel');
  const aboutChevron = document.getElementById('gpm-about-chevron');
  document.getElementById('gpm-about-toggle').addEventListener('click', () => {
    aboutOpen = !aboutOpen;
    aboutPanel.style.display = aboutOpen ? 'block' : 'none';
    aboutChevron.style.transform = aboutOpen ? 'rotate(180deg)' : 'rotate(0deg)';
  });

  // ---- analysis type dropdown ----
  const ANALYSIS_TYPES = [
    { key: 'dose-response', label: 'Dose Response', note: '' },
    { key: 'single-concentration', label: 'Single Concentration',
      note: 'Single Concentration is a real CellTiter-Glo analysis type.' },
    { key: 'linearity', label: 'Linearity Analysis',
      note: 'Linearity Analysis is a real CellTiter-Glo analysis type.' },
  ];
  let analysisOpen = false;
  const analysisMenu = document.getElementById('gpm-analysis-menu');
  const analysisChevronEl = document.getElementById('gpm-analysis-chevron');
  function renderAnalysisMenu() {
    analysisMenu.style.display = analysisOpen ? 'block' : 'none';
    analysisChevronEl.style.transform = analysisOpen ? 'rotate(180deg)' : 'rotate(0deg)';
    if (!analysisOpen) return;
    analysisMenu.innerHTML = ANALYSIS_TYPES.map((a) => {
      const isDoseResponse = a.key === 'dose-response';
      return `<div class="ww-menu__item gpm-hover" data-note="${a.note}" data-key="${a.key}" style="background:${isDoseResponse ? 'var(--pn-color-state-selected-bg)' : 'transparent'};cursor:${isDoseResponse ? 'pointer' : 'not-allowed'};">${a.label}</div>`;
    }).join('');
    analysisMenu.querySelectorAll('.ww-menu__item').forEach((item) => {
      item.addEventListener('mouseenter', showNote);
      item.addEventListener('mousemove', moveNote);
      item.addEventListener('mouseleave', hideNote);
      item.addEventListener('click', () => { analysisOpen = false; renderAnalysisMenu(); });
    });
  }
  document.getElementById('gpm-analysis-toggle').addEventListener('click', () => {
    analysisOpen = !analysisOpen;
    renderAnalysisMenu();
  });

  // ---- well type table ----
  // Same table as the real (cut) editor - kept in sync by hand since this page
  // has no per-well editing to diverge on.
  const TYPES = {
    control: {
      label: 'Control', color: 'var(--pn-color-plate-control-indicator)',
      fields: ['cellType', 'sampleName'], lines: (d) => ['Control', d.cellType],
    },
    sample: {
      label: 'Sample', color: 'var(--pn-color-plate-sample-indicator)',
      fields: ['compound', 'concentration', 'cellType', 'sampleName'],
      lines: (d) => [d.cellType, d.compound, d.concentration ? `${d.concentration} ${d.concentrationUnit || ''}`.trim() : ''],
    },
    background: {
      label: 'Background', color: 'var(--pn-color-plate-background-indicator)',
      fields: ['sampleName'], lines: () => ['Background'],
    },
    standard: {
      label: 'Standard', color: 'var(--ctg-plate-standard-indicator)',
      fields: ['concentration', 'sampleName'], staticUnit: 'µM ATP',
      lines: (d) => ['Standard', d.concentration ? `${d.concentration} µM ATP` : ''],
    },
  };
  function hasField(type, name) {
    const def = TYPES[type];
    return !!(def && def.fields.includes(name));
  }

  // ---- demo plate ----
  const DEMO_STANDARD_BY_COL = { 1:'5', 2:'1.25', 3:'0.3125', 4:'0.07813', 5:'0.01953', 6:'0.004883', 7:'0.001221', 8:'0.0003053' };
  const DEMO_COMPOUNDS = [
    { rows: ['E','F'], compound: 'Panobinostat', conc: ['0.0002823','0.000847','0.002541','0.007623','0.02287','0.0686','0.2058','0.6173','1.852','5.557','16.67','50'] },
    { rows: ['G','H'], compound: 'Bortezomib', conc: ['0.0001409','0.000423','0.001269','0.003809','0.01143','0.0343','0.1029','0.3087','0.926','2.778','8.333','25'] },
  ];
  function buildDemoPlate() {
    const p = (n) => String(n).padStart(2, '0');
    const wellTypes = {}, wellData = {};
    ['A','B','C','D'].forEach((r) => {
      for (let c = 1; c <= 8; c++) {
        const id = `${r}${p(c)}`;
        wellTypes[id] = 'standard';
        wellData[id] = { concentration: DEMO_STANDARD_BY_COL[c], concentrationUnit: 'µM ATP', sampleName: '' };
      }
      wellTypes[`${r}09`] = 'background'; wellData[`${r}09`] = { sampleName: '' };
      wellTypes[`${r}10`] = 'background'; wellData[`${r}10`] = { sampleName: '' };
      wellTypes[`${r}11`] = 'control'; wellData[`${r}11`] = { cellType: '', sampleName: '' };
      wellTypes[`${r}12`] = 'control'; wellData[`${r}12`] = { cellType: '', sampleName: '' };
    });
    DEMO_COMPOUNDS.forEach((g) => g.rows.forEach((r) => {
      for (let c = 1; c <= 12; c++) {
        const id = `${r}${p(c)}`;
        wellTypes[id] = 'sample';
        wellData[id] = { compound: g.compound, concentration: g.conc[c - 1], concentrationUnit: 'nM', cellType: '', sampleName: '' };
      }
    }));
    return { wellTypes, wellData };
  }

  const { wellTypes, wellData } = buildDemoPlate();
  let selectedWellId = 'A01'; // selected from the start - the wizard never shows an empty state here

  // Same hardcoded pixel math as the real editor - correct only while
  // --pn-font-size-sm is 0.8333rem, --pn-font-line-height-normal is 1.5 and
  // the root font size is 16px.
  function computeRowHeight() {
    const lineH = 0.8333 * 1.5 * 16;
    const padV = 2 * 8;
    const minHeight = Math.ceil(2 * lineH + padV);
    let maxLines = 1;
    Object.entries(wellTypes).forEach(([id, type]) => {
      const def = TYPES[type];
      if (!def) return;
      const lines = def.lines(wellData[id] || {}).filter(Boolean).length;
      maxLines = Math.max(maxLines, lines);
    });
    return Math.max(minHeight, Math.ceil(maxLines * lineH + padV));
  }

  function renderPlate() {
    const rows = ['A','B','C','D','E','F','G','H'];
    const plateArea = document.getElementById('gpm-plate-area');
    let html = '<div class="plate-grid" style="grid-template-columns:28px repeat(12,1fr);grid-template-rows:24px repeat(8, minmax(' + computeRowHeight() + 'px, 1fr));">';
    html += '<div class="well-header"></div>';
    for (let c = 1; c <= 12; c++) html += `<div class="well-header col-num">${String(c).padStart(2, '0')}</div>`;
    rows.forEach((row) => {
      html += `<div class="well-header">${row}</div>`;
      for (let c = 1; c <= 12; c++) {
        const id = `${row}${String(c).padStart(2, '0')}`;
        const type = wellTypes[id];
        const def = type ? TYPES[type] : null;
        let content = '';
        if (def) {
          const lines = def.lines(wellData[id] || {}).filter(Boolean);
          content = `<div style="display:flex;flex-direction:column;justify-content:center;width:100%;padding:var(--pn-spacing-8) var(--pn-spacing-4);overflow:hidden;">${lines.map((t) => `<div class="well__text">${t}</div>`).join('')}</div>`;
        }
        const cls = ['well'];
        if (type) cls.push(`well--${type}`);
        if (id === selectedWellId) cls.push('is-selected');
        html += `<div class="${cls.join(' ')}" data-well-id="${id}">${content}</div>`;
      }
    });
    html += '</div>';
    plateArea.innerHTML = html;
    plateArea.querySelectorAll('[data-well-id]').forEach((el) => {
      el.addEventListener('click', () => {
        selectedWellId = el.dataset.wellId;
        renderPlate();
        renderWizard();
      });
    });
  }

  function renderWizard() {
    const id = selectedWellId;
    const type = id ? wellTypes[id] : null;
    const def = type ? TYPES[type] : null;
    const d = (id && wellData[id]) || {};
    const body = document.getElementById('gpm-wizard-body');
    if (!def) { body.innerHTML = ''; return; }
    body.innerHTML = `
      <div class="field-group">
        <div class="field-label">Well Type</div>
        <div style="display:flex;align-items:center;gap:var(--pn-spacing-8);font-size:var(--pn-font-size-sm);color:var(--pn-color-text-primary);">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="4" fill="${def.color}"></circle><circle cx="8" cy="8" r="5.5" stroke="${def.color}" stroke-opacity="0.2" stroke-width="3"></circle></svg>
          ${def.label}
        </div>
      </div>
      ${hasField(type, 'compound') ? `
        <div class="field-group">
          <div class="field-label">Compound</div>
          <div class="field-input field-input--display">${d.compound || ''}</div>
        </div>
      ` : ''}
      ${hasField(type, 'concentration') ? `
        <div class="field-group">
          <div class="field-label">Concentration</div>
          <div class="ww-row">
            <div class="field-input field-input--display" style="flex:1;min-width:0;">${d.concentration || ''}</div>
            <div class="ww-unit-static">${d.concentrationUnit || ''}</div>
          </div>
        </div>
      ` : ''}
      ${hasField(type, 'cellType') ? `
        <div class="field-group">
          <div class="field-label">Cell Type</div>
          <div class="field-input field-input--display">${d.cellType || ''}</div>
        </div>
      ` : ''}
      <div class="field-group">
        <div class="field-label">Sample Name</div>
        <div class="field-input field-input--display">${d.sampleName || ''}</div>
      </div>
    `;
  }

  document.getElementById('gpm-plate-name').textContent = window.CTG.PLATE_MAPS[0].name;
  renderPlate();
  renderWizard();

  // ---- Select Instrument modal ----
  const selectInstrumentHost = document.getElementById('gpm-select-instrument');
  selectInstrumentHost.style.display = 'none';
  const selectInstrumentApi = mountCtgSelectInstrument(selectInstrumentHost, {
    open: false,
    destination: 'ctg-read-in-progress.html?from=platemap',
    onCancel() {
      selectInstrumentHost.style.display = 'none';
      selectInstrumentApi.hide();
    },
  });
  document.getElementById('gpm-next-btn').addEventListener('click', () => {
    document.getElementById('gpm-next-btn').classList.remove('demo-cue');
    selectInstrumentHost.style.display = 'block';
    selectInstrumentApi.show();
  });
</script>
</body>
</html>
