<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The demo is hosted on a public URL because the survey audience cannot hold
     GitHub accounts. noindex is what keeps it out of search results; see the
     hosting note in cow3rk. Deliberately NOT paired with a robots.txt Disallow:
     blocking the fetch means the crawler never reads this tag, and a URL found
     elsewhere can still be listed. Let them fetch, and tell them not to index. -->
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/fonts/fonts.css">
<link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/colors_and_type.css">
<link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/ui_kits/pronect/styles.css">
<link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/styles.css">
<link rel="stylesheet" href="pronect-demo.css">
<link rel="stylesheet" href="read-flow.css">
<style>
  body{margin:0;background:var(--pn-color-surface-page);font-family:var(--pn-font-family-sans)}
  .rpt-grid{display:grid;grid-template-columns:34px repeat(12,1fr);grid-template-rows:28px repeat(8,minmax(54px,1fr));gap:var(--pn-spacing-2);width:100%;}
  .rpt-head{display:flex;align-items:center;justify-content:center;font:500 14px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);border:1px solid var(--pn-color-border-subtle);border-radius:var(--pn-border-radius-sm);background:var(--pn-color-surface-default);}
  .rpt-rowlabel{display:flex;align-items:center;justify-content:center;font:500 14px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);border:1px solid var(--pn-color-border-subtle);border-radius:var(--pn-border-radius-sm);background:var(--pn-color-surface-default);}
  /* Read Protocol and the reads list. Fixed width so the heat map keeps the
     rest, matching 122 and 123. */
  .rpt-side{width:196px;min-width:196px;flex:none;display:flex;flex-direction:column;min-height:0;
            border:1px solid var(--pn-color-border-subtle);border-radius:var(--pn-border-radius-md);overflow:hidden;}
  .rpt-side__title{font:700 11px/1 var(--pn-font-family-sans);letter-spacing:.08em;text-transform:uppercase;
                   color:var(--pn-color-text-muted);padding:14px 16px 10px;}
  .rpt-side__row{font:400 13px/1.5 var(--pn-font-family-sans);color:var(--pn-color-text-primary);padding:0 16px;}
  .rpt-reads{flex:1;min-height:0;overflow:auto;padding-bottom:8px;}
  .rpt-read{font:400 13px/1 var(--pn-font-family-sans);padding:9px 16px;cursor:pointer;border-left:3px solid transparent;}
  .rpt-read.is-done{color:var(--pn-color-text-primary);}
  .rpt-read.is-done:hover{background:var(--pn-color-surface-hover);}
  /* Scheduled reads are informational only: no hover, no pointer. */
  .rpt-read.is-pending{color:var(--pn-color-text-disabled);cursor:default;}
  .rpt-read.is-active{font-weight:var(--pn-font-weight-semibold);background:var(--pn-color-sol-50);border-left-color:var(--pn-color-sol-500);}
</style>
</head>
<body>

<!-- Read Plate Tool results.
     ==================================================================
     Built from 124 (endpoint, complete), 122 (time course, complete) and
     123 (time course, in progress).

     Three states, one page, branching on ?mode and ?progress:
       endpoint            three buttons, no sidebar
       timecourse          two buttons, sidebar, all reads done
       timecourse+partial  two buttons, sidebar, later reads greyed

     The missing button on time course is not an oversight. CH apps do
     not accept a time course read, so there is nothing to hand off to
     and Analyze With Plate Map does not appear. Confirmed by 122 and
     123 and stated in the Brain Dump.

     Heat map maths is the same as the (cut) ctg-read-results screen: a
     logarithmic ramp, shifted when the plate contains non-positive wells.
     This plate exercises that shift properly for the first time; see the
     data note. -->
<div data-screen-label="RPT Results" class="read-page">

  <div style="flex:1;display:flex;min-height:0;">

    <div id="rr-sidebar" style="width:clamp(101px,7.5vw,284px);flex:none;align-self:stretch;display:block;"></div>

    <div style="flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;">

      <div id="rr-topbar" style="display:block;width:100%;flex:none;"></div>

      <div class="read-body">

        <div class="read-header">
          <!-- No app-icon link: it used to point at rpt-home.dc.html, cut
               from this conversion. Just the icon now, not clickable. -->
          <img class="read-header__icon" src="assets/rpt-icon.svg" alt="" style="flex-shrink:0;">
          <div style="min-width:0;">
            <div class="read-header__name">Read Plate Tool</div>
            <div class="read-header__file" id="rr-filename"></div>
          </div>
          <span style="flex:1;min-width:16px;"></span>
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <button id="rr-analyze-btn" class="rr-hover" data-note="Sends this instrument data file to a Cell Health app for analysis."
                    style="background:var(--pn-color-surface-default);border:1px solid var(--pn-color-border-default);border-radius:var(--pn-border-radius-md);padding:12px 20px;cursor:pointer;font:400 15px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);display:none;align-items:center;">Analyze With Plate Map</button>
            <button class="rr-hover" data-note="Takes you back to Read Plate Tool's home screen to begin another read."
                    style="background:var(--pn-color-surface-default);border:1px solid var(--pn-color-border-default);border-radius:var(--pn-border-radius-md);padding:12px 20px;font:400 15px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);display:inline-flex;align-items:center;cursor:not-allowed;">Read Another Plate</button>
            <button class="rr-hover" data-note="Download saves the instrument data file to your computer."
                    style="background:var(--pn-color-surface-default);border:1px solid var(--pn-color-border-default);border-radius:var(--pn-border-radius-md);padding:12px 20px;cursor:pointer;font:400 15px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);display:inline-flex;align-items:center;">Download Results</button>
          </div>
        </div>

        <div class="read-card" style="align-items:stretch;gap:0;">
          <div style="flex:1;min-height:0;display:flex;gap:20px;">

            <div id="rr-side" class="rpt-side" style="display:none;">
              <div class="rpt-side__title">Read Protocol</div>
              <div class="rpt-side__row">Integration Time: 1 sec</div>
              <div class="rpt-side__row">Read Interval: 5 min</div>
              <div class="rpt-side__row" id="rr-proto-count"></div>
              <div class="rpt-side__row" style="padding-bottom:12px;">Time point 0 included</div>
              <div class="rpt-side__title" style="border-top:1px solid var(--pn-color-border-subtle);">Reads</div>
              <div class="rpt-reads" id="rr-reads-list"></div>
            </div>

            <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
              <div class="rpt-grid" id="rr-plate-grid" style="flex:1;"></div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="pronect-sidebar.js"></script>
<script src="pronect-topbar.js"></script>
<script>
  mountPronectSidebar(document.getElementById('rr-sidebar'), { dashboardHref: 'user-dashboard.html' });
  mountPronectTopbar(document.getElementById('rr-topbar'));

  // ---- shared hover-note tooltip ----
  let noteEl = null;
  function showNote(e) {
    const note = e.currentTarget.dataset.note;
    if (!note) return;
    if (!noteEl) {
      noteEl = document.createElement('div');
      noteEl.style.cssText = 'position:fixed;background:var(--pn-color-neutral-900);color:var(--pn-color-text-inverse);font:500 12px/1.3 var(--pn-font-family-sans);padding:6px 10px;border-radius:6px;pointer-events:none;z-index:2000;box-shadow:var(--pn-shadow-xs);max-width:240px;';
      document.body.appendChild(noteEl);
    }
    noteEl.textContent = note;
    noteEl.style.left = (e.clientX + 14) + 'px';
    noteEl.style.top = (e.clientY + 18) + 'px';
  }
  function moveNote(e) {
    if (!noteEl) return;
    noteEl.style.left = (e.clientX + 14) + 'px';
    noteEl.style.top = (e.clientY + 18) + 'px';
  }
  function hideNote() { if (noteEl) { noteEl.remove(); noteEl = null; } }
  function wireHover(el) {
    el.addEventListener('mouseenter', showNote);
    el.addEventListener('mousemove', moveNote);
    el.addEventListener('mouseleave', hideNote);
  }
  document.querySelectorAll('.rr-hover').forEach(wireHover);

  // Real BacTiter-Glo plate, from DL-BTG-LA-ATP.xlsx's hidden RawReadJson sheet.
  // 22 of its 96 wells sit at or below zero, down to -73 RLU, which is what 124
  // shows and what the CellTiter-Glo plate cannot show.
  const WELLS = [[327184, 71333, 18483, 4765, 1192, 342, -22, 63, 47, -6, 61, -16], [325456, 75093, 18310, 4691, 1165, 331, -43, 78, 78, -9, 16, -1], [332745, 74920, 18550, 4506, 1286, 326, 28, 85, 13, 76, 58, -15], [325612, 75555, 18845, 4935, 1390, 366, 30, 188, -62, 6, -13, 17], [28239, 7624, 1970, 549, 214, -13, 72, -17, 115, -57, -49, 1], [28989, 7557, 1764, 558, 130, 13, 15, 41, -10, 9, 49, -52], [27979, 7301, 1749, 465, 51, 119, -36, -2, 6, 93, 3, 10], [27658, 7022, 1694, 494, 100, -1, -28, 30, -26, -73, -39, 13]];
  const ROW_LABELS = ['A','B','C','D','E','F','G','H'];

  // Same ramp as the (cut) ctg-read-results screen: blue low through cyan,
  // green and yellow to red high, positioned logarithmically.
  const RAMP = [
    [0.00, [ 91,141,239]], [0.10, [ 43,184,245]], [0.22, [ 34,220,240]],
    [0.34, [ 36,227,196]], [0.45, [ 44,229,149]], [0.58, [111,232, 79]],
    [0.70, [185,230, 43]], [0.80, [245,216, 21]], [0.88, [251,174, 18]],
    [0.95, [249,125, 24]], [1.00, [240, 74, 30]],
  ];

  // Every 5 minutes for 60 minutes, with a timepoint 0 read, so Read 0 through
  // Read 12 inclusive.
  const READ_COUNT = 13;

  function q(k) { return new URLSearchParams(window.location.search).get(k); }
  function isTimeCourse() { return q('mode') === 'timecourse'; }
  function doneCount() {
    const p = parseInt(q('progress'), 10);
    if (!Number.isFinite(p)) return READ_COUNT;
    return Math.max(1, Math.min(READ_COUNT, p));
  }
  function stampFileName() {
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    let h = d.getHours();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return 'Read Plate Tool ' + d.getFullYear() + ' ' + p(d.getMonth() + 1) + ' ' + p(d.getDate())
      + ' ' + h + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + ' ' + ap;
  }

  function ramp(t) {
    t = Math.max(0, Math.min(1, t));
    for (let i = 0; i < RAMP.length - 1; i++) {
      const [p0, c0] = RAMP[i], [p1, c1] = RAMP[i + 1];
      if (t <= p1) {
        const f = (t - p0) / (p1 - p0);
        return 'rgb(' + c0.map((v, k) => Math.round(v + (c1[k] - v) * f)).join(',') + ')';
      }
    }
    return 'rgb(' + RAMP[RAMP.length - 1][1].join(',') + ')';
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- the time course series (Read 0 is the measured plate; 1-12 drift from it) ----
  let cachedSeries = null;
  function series() {
    if (cachedSeries) return cachedSeries;
    const out = [WELLS.map((row) => row.slice())];
    const rngs = WELLS.map((row, r) => row.map((_, c) => mulberry32(1000 + r * 12 + c)));
    let prop = WELLS.map((row) => row.map(() => 0));
    let abs = WELLS.map((row) => row.map(() => 0));
    for (let i = 1; i < READ_COUNT; i++) {
      const plate = WELLS.map((row, r) => row.map((v, c) => {
        const rnd = rngs[r][c];
        prop[r][c] = Math.max(-0.28, Math.min(0.28, prop[r][c] + (rnd() - 0.5) * 0.14));
        abs[r][c] = Math.max(-45, Math.min(45, abs[r][c] + (rnd() - 0.5) * 22));
        return Math.round(v * (1 + prop[r][c]) + abs[r][c]);
      }));
      out.push(plate);
    }
    cachedSeries = out;
    return out;
  }
  function wellsForRead(i) {
    if (!isTimeCourse()) return WELLS;
    const s = series();
    return s[Math.max(0, Math.min(s.length - 1, i))];
  }

  document.getElementById('rr-filename').textContent = stampFileName();

  const tc = isTimeCourse();
  document.getElementById('rr-analyze-btn').style.display = tc ? 'none' : 'inline-flex';
  document.getElementById('rr-side').style.display = tc ? 'flex' : 'none';
  document.getElementById('rr-proto-count').textContent = `Number of Reads: ${READ_COUNT - 1}`;

  let selectedRead = 0; // Always the first read on arrival, whatever the state.

  function renderPlate() {
    const done = doneCount();
    const wells = wellsForRead(selectedRead);

    // The colour scale is computed from the SELECTED READ, not from the whole
    // run - see the note in the original comment history for why.
    const scaleSource = wells.flat();
    const rawMin = Math.min.apply(null, scaleSource), rawMax = Math.max.apply(null, scaleSource);
    const shift = rawMin > 0 ? 0 : 1 - rawMin;
    const lo = Math.log10(rawMin + shift), hi = Math.log10(rawMax + shift);

    const gridEl = document.getElementById('rr-plate-grid');
    let html = '<div class="rpt-head"></div>';
    for (let c = 1; c <= 12; c++) html += `<div class="rpt-head">${String(c).padStart(2, '0')}</div>`;
    wells.forEach((cells, r) => {
      html += `<div class="rpt-rowlabel">${ROW_LABELS[r]}</div>`;
      cells.forEach((v, c) => {
        const bg = ramp((Math.log10(v + shift) - lo) / (hi - lo));
        const title = `${ROW_LABELS[r]}${c + 1}: ${v.toLocaleString('en-US')} RLU`;
        html += `<div title="${title}" style="display:flex;align-items:center;justify-content:center;padding:18px 4px;border:1px solid var(--pn-color-border-subtle);border-radius:var(--pn-border-radius-sm);font:400 var(--pn-font-size-base)/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);cursor:default;background:${bg};">${v}</div>`;
      });
    });
    gridEl.innerHTML = html;

    if (tc) renderReadsList(done);
  }

  function renderReadsList(done) {
    const listEl = document.getElementById('rr-reads-list');
    listEl.innerHTML = '';
    for (let i = 0; i < READ_COUNT; i++) {
      const isDone = i < done;
      const cls = 'rpt-read ' + (isDone ? 'is-done' : 'is-pending') + (i === selectedRead && isDone ? ' is-active' : '');
      const note = isDone ? '' : 'This read has not run yet. Scheduled reads are informational only.';
      const row = document.createElement('div');
      row.className = cls;
      row.dataset.note = note;
      row.textContent = 'Read ' + i;
      wireHover(row);
      if (isDone) row.addEventListener('click', () => { selectedRead = i; renderPlate(); });
      listEl.appendChild(row);
    }
  }

  renderPlate();
</script>
</body>
</html>
