<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The demo is hosted on a public URL because the survey audience cannot hold
     GitHub accounts. noindex is what keeps it out of search results; see the
     hosting note in cow3rk. Deliberately NOT paired with a robots.txt Disallow:
     blocking the fetch means the crawler never reads this tag, and a URL found
     elsewhere can still be listed. Let them fetch, and tell them not to index. -->
<meta name="robots" content="noindex, nofollow">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/colors_and_type.css">
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/styles.css">
  <link rel="stylesheet" href="pronect-demo.css">
  <script src="ctg-demo-data.js"></script>
  <style>
    body{margin:0;background:transparent}
    .ad-tab{background:none;border:0;border-bottom:3px solid transparent;padding:14px 18px;cursor:pointer;
            font:400 16px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);}
    .ad-tab.is-on{font-weight:var(--pn-font-weight-semibold);border-bottom-color:var(--pn-color-sol-500);background:var(--pn-color-sol-50);}
    /* The two drop targets. Empty they show a plus; filled they show the file
       type and its name, per 127 and 133. */
    .ad-slot{flex:1;min-width:0;border:1px solid var(--pn-color-border-default);border-radius:var(--pn-border-radius-md);
             display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
             padding:32px 24px;min-height:300px;cursor:pointer;background:var(--pn-color-surface-default);}
    .ad-slot:hover{background:var(--pn-color-surface-hover);}
    .ad-slot__label{font:400 15px/1.4 var(--pn-font-family-sans);color:var(--pn-color-text-primary);text-align:center;overflow-wrap:anywhere;}
    .ad-row{display:grid;align-items:center;gap:16px;padding:14px 8px;border-bottom:1px solid var(--pn-color-border-subtle);}
    .ad-icon{width:24px;height:24px;padding:0;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:not-allowed;}
  </style>
</helmet>

<!-- Analyze Data.
     ==================================================================
     Built from 125 to 133. A modal over the CellTiter-Glo app home, like
     Read Plate, which is why ctg-analyze-data as a PAGE stayed deleted.

     Scope, per Cate: the modals only. Analyze does not run an analysis
     and does not land on results. Stephanie's note was that the CTG
     steps do not need showing separately, but the app home has three
     cards side by side and leaving one inert reads as lopsided, so the
     card opens something real and stops before the expensive part.

     FOUR list modals in this demo now, each with its own row actions,
     and the differences are principled rather than arbitrary:
       Open Plate Map, from the editor   rename, delete, download, pin
       Select Plate Map, here            + edit, because you are not in
                                           the editor already
       Select Instrument Data File       rename, download, pin. You do
                                           not delete or edit a machine's
                                           output.
       View Analysis Results             rename, delete, download, pin
     All four filter one shared action list by key rather than declaring
     their own, so an icon or a note is fixed in one place. -->
<sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
  <div style="position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div style="background:var(--pn-color-surface-default);border-radius:var(--pn-border-radius-lg);width:1200px;max-width:100%;height:{{ modalHeight }};max-height:100%;box-shadow:var(--pn-shadow-3);display:flex;flex-direction:column;padding:32px 40px;font-family:var(--pn-font-family-sans);">

      <h2 style="margin:0 0 4px;font:600 24px/1.2 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">{{ title }}</h2>

      <!-- Tabs only on the main screen; a picker replaces the whole card. -->
      <sc-if value="{{ isMain }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;gap:4px;border-bottom:1px solid var(--pn-color-border-subtle);flex:none;margin-top:12px;">
          <button class="{{ tabResultsCls }}" onClick="{{ goResults }}">View Analysis Results</button>
          <button class="{{ tabAnalyzeCls }}" onClick="{{ goAnalyze }}">Analyze Data</button>
        </div>
      </sc-if>

      <!-- ---- Tab 1: Analyze Data ---- -->
      <sc-if value="{{ isAnalyzeTab }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;padding-top:24px;">
          <div style="display:flex;align-items:center;gap:24px;margin-bottom:64px;">
            <span style="font:500 15px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);flex:none;">Analysis Results Name</span>
            <span style="flex:1;font:400 15px/1 var(--pn-font-family-sans);color:var(--pn-color-text-muted);overflow-wrap:anywhere;">{{ analysisName }}</span>
            <button data-note="The analysis name can be edited before the analysis runs."
                    onMouseEnter="{{ showNote }}" onMouseMove="{{ moveNote }}" onMouseLeave="{{ hideNote }}"
                    style="flex:none;background:var(--pn-color-surface-default);border:1px solid var(--pn-color-border-default);border-radius:var(--pn-border-radius-md);padding:8px 12px;cursor:not-allowed;font:400 15px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">Rename</button>
          </div>

          <div style="display:flex;align-items:center;gap:20px;margin-bottom:64px;">
            <div class="ad-slot" onClick="{{ openPlateMapPicker }}">
              <sc-if value="{{ noPlateMap }}" hint-placeholder-val="{{ true }}">
                <img src="assets/plate-map.svg" alt="" width="80" height="70">
              </sc-if>
              <sc-if value="{{ hasPlateMap }}" hint-placeholder-val="{{ false }}">
                <img src="assets/plate-map.svg" alt="" width="80" height="70">
              </sc-if>
              <span class="ad-slot__label">{{ plateMapLabel }}</span>
            </div>

            <div class="ad-slot" onClick="{{ openReadPicker }}">
              <sc-if value="{{ noRead }}" hint-placeholder-val="{{ true }}">
                <img src="assets/read-file.svg" alt="" width="71" height="70">
              </sc-if>
              <sc-if value="{{ hasRead }}" hint-placeholder-val="{{ false }}">
                <img src="assets/read-file.svg" alt="" width="71" height="70">
              </sc-if>
              <span class="ad-slot__label">{{ readLabel }}</span>
            </div>
          </div>

          <div style="display:flex;justify-content:center;gap:16px;">
            <button onClick="{{ onCancel }}" style="{{ ghostBtn }}">Cancel</button>
            <button onClick="{{ onAnalyze }}" disabled="{{ analyzeDisabled }}" style="{{ analyzeStyle }}">Analyze</button>
          </div>
        </div>
      </sc-if>

      <!-- ---- Tab 2: View Analysis Results, and the two pickers ----
           One list renderer for all three. They differ by their rows, their
           row actions and their confirm label, so there is no reason for
           three copies of this markup. -->
      <sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
        <div style="flex:1;min-height:0;display:flex;flex-direction:column;">

          <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px 0;flex:none;">
            <sc-if value="{{ showAppFilter }}" hint-placeholder-val="{{ true }}">
              <!-- A single-item picker isn't a real choice, so it doesn't open a menu -
                   but it still reads as a dropdown field in its default/closed state,
                   same house style as the Select Plate Map picker on Read Plate. -->
              <div data-note="Files from your other Cell Health apps can be selected here."
                   onMouseEnter="{{ showNote }}" onMouseMove="{{ moveNote }}" onMouseLeave="{{ hideNote }}"
                   style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:var(--pn-color-neutral-50);border:1px solid var(--pn-color-border-default);border-radius:6px;cursor:not-allowed;">
                <span style="font:400 15px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">CellTiter-Glo</span>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--pn-color-text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M6 9l6 6 6-6"/></svg>
              </div>
            </sc-if>
            <span style="flex:1;"></span>
            <!-- Matches the dashboard's / Read Plate's search box exactly. -->
            <label data-note="Search filters this list by file name."
                   onMouseEnter="{{ showNote }}" onMouseMove="{{ moveNote }}" onMouseLeave="{{ hideNote }}"
                   style="display:flex;align-items:center;gap:8px;background:var(--pn-color-surface-default);border:1px solid var(--pn-color-border-default);border-radius:6px;padding:6px 10px;width:200px;cursor:not-allowed;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--pn-color-text-muted)" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="16" y1="16" x2="21" y2="21" stroke-linecap="round"></line></svg>
              <input placeholder="Search" disabled readonly tabindex="-1" style="border:0;outline:none;flex:1;min-width:0;font:400 var(--pn-font-size-sm)/1 var(--pn-font-family-sans);color:var(--pn-color-text-muted);background:transparent;pointer-events:none;cursor:not-allowed;user-select:none;">
            </label>
          </div>

          <!-- radio -> pin -> name -> date -> other actions, matching Read Full
               Plate's radio-leads convention. -->
          <div style="display:grid;grid-template-columns:{{ gridCols }};gap:16px;align-items:center;padding:0 0 12px;border-bottom:1px solid var(--pn-color-border-subtle);flex:none;">
            <span></span>
            <span></span>
            <span style="font:500 15px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">Name</span>
            <span style="font:500 15px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">Date</span>
            <span></span>
          </div>

          <div style="flex:1;min-height:0;overflow:auto;">
            <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
              <!-- Clicking anywhere in the row selects it; the icon buttons stop
                   the click from bubbling so they stay their own targets. -->
              <div onClick="{{ r.onSelect }}" style="display:grid;grid-template-columns:{{ gridCols }};gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--pn-color-border-subtle);cursor:pointer;">
                <button onClick="{{ r.onSelect }}" style="{{ r.radioStyle }}"><span style="{{ r.radioDotStyle }}"></span></button>
                <!-- Design system pin glyph, inlined per its own usage spec: currentColor
                     can't cross an <img src> boundary. -->
                <button class="ad-icon" data-note="{{ r.pinNote }}" onClick="{{ stop }}"
                        onMouseEnter="{{ showNote }}" onMouseMove="{{ moveNote }}" onMouseLeave="{{ hideNote }}">
                  <sc-if value="{{ r.pinned }}" hint-placeholder-val="{{ false }}">
                    <svg width="17" height="17" viewBox="0 0 17 17" fill="none" style="color:var(--pn-color-brand-sol);" role="img" aria-label="Pinned"><path d="M7.56663 2.9452C7.82034 2.26215 8.69593 2.07106 9.21116 2.58629L14.2776 7.65273C14.7928 8.16796 14.6017 9.04356 13.9187 9.29726L13.4221 9.48169L10.0666 12.8372C10.0666 12.8372 10.0666 14.6656 9.31213 16.059C9.04914 16.5446 8.40783 16.5473 8.01731 16.1567L0.707154 8.84659C0.31663 8.45606 0.319266 7.81475 0.804919 7.55177C2.19826 6.79727 4.02668 6.79727 4.02668 6.79727L7.3822 3.44174L7.56663 2.9452Z" fill="currentColor"></path><rect x="4.69788" y="11.4951" width="0.949086" height="6.6436" transform="rotate(45 4.69788 11.4951)" fill="currentColor"></rect></svg>
                  </sc-if>
                  <sc-if value="{{ r.notPinned }}" hint-placeholder-val="{{ true }}">
                    <svg width="17" height="17" viewBox="0 0 17 17" fill="none" style="color:var(--pn-color-neutral-700);" role="img" aria-label="Not pinned"><path d="M13.2481 9.01298L13.1458 9.05097L13.0686 9.12814L9.71307 12.4837L9.56662 12.6301L9.56662 12.8367L9.56662 12.8369L9.56662 12.8369V12.837V12.8372L9.56661 12.8392L9.56648 12.8514C9.56633 12.8628 9.56601 12.8807 9.56534 12.9045C9.56401 12.9522 9.56129 13.0236 9.55576 13.1142C9.54468 13.2958 9.52241 13.5531 9.4778 13.8517C9.38748 14.4562 9.21031 15.197 8.87245 15.8209C8.83076 15.8979 8.76944 15.9328 8.68665 15.9371C8.59292 15.942 8.47096 15.9033 8.37086 15.8032L1.06071 8.49303C0.960611 8.39294 0.921938 8.27098 0.926799 8.17724C0.931092 8.09445 0.966015 8.03313 1.043 7.99144C1.66694 7.65358 2.40767 7.47641 3.01218 7.38609C3.31077 7.34148 3.56809 7.31921 3.74967 7.30813C3.84031 7.3026 3.91166 7.29988 3.95936 7.29855C3.9832 7.29788 4.0011 7.29756 4.01251 7.29741L4.02468 7.29728L4.02668 7.29727H4.02686L4.02697 7.29727L4.027 7.29727L4.02715 7.29727L4.23378 7.29727L4.38023 7.15082L7.73576 3.7953L7.81292 3.71813L7.85091 3.61584L8.03534 3.1193C8.1622 2.77777 8.59999 2.68222 8.85761 2.93984L13.9241 8.00628C14.1817 8.2639 14.0861 8.7017 13.7446 8.82855L13.2481 9.01298Z" stroke="currentColor"></path><rect x="4.69788" y="11.4951" width="0.949086" height="6.6436" transform="rotate(45 4.69788 11.4951)" fill="currentColor"></rect></svg>
                  </sc-if>
                </button>
                <span style="font:400 15px/1.3 var(--pn-font-family-sans);color:var(--pn-color-text-primary);overflow-wrap:anywhere;">{{ r.name }}</span>
                <span style="font:400 14px/1.3 var(--pn-font-family-sans);color:var(--pn-color-text-muted);">{{ r.date }}</span>
                <span style="display:flex;align-items:center;justify-content:flex-end;gap:14px;">
                  <sc-for list="{{ r.actions }}" as="act" hint-placeholder-count="4">
                    <button data-note="{{ act.note }}" onClick="{{ stop }}"
                            onMouseEnter="{{ showNote }}" onMouseMove="{{ moveNote }}" onMouseLeave="{{ hideNote }}"
                            style="{{ act.style }}"><svg viewBox="0 0 24 24" width="18" height="18" fill="{{ act.fill }}" stroke="{{ act.stroke }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ act.path }}"/></svg></button>
                  </sc-for>
                </span>
              </div>
            </sc-for>
          </div>

          <div style="display:flex;justify-content:center;gap:16px;padding-top:24px;flex:none;">
            <button onClick="{{ onListCancel }}" style="{{ ghostBtn }}">Cancel</button>
            <button onClick="{{ onListConfirm }}" disabled="{{ confirmDisabled }}" style="{{ confirmStyle }}">{{ confirmLabel }}</button>
          </div>
        </div>
      </sc-if>

    </div>
  </div>
</sc-if>

<sc-if value="{{ note }}">
  <div style="position:fixed;left:{{ noteX }};top:{{ noteY }};background:var(--pn-color-neutral-900);color:var(--pn-color-text-inverse);font:500 12px/1.3 var(--pn-font-family-sans);padding:6px 10px;border-radius:6px;pointer-events:none;z-index:2200;box-shadow:var(--pn-shadow-xs);max-width:240px;">{{ note }}</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1600, &quot;height&quot;: 900},
  &quot;open&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;section&quot;: &quot;State&quot;, &quot;tsType&quot;: &quot;boolean&quot; }
}">
// Lazily, never as a top-level const: dc-runtime evaluates an imported
// component's logic class before its own helmet scripts have loaded.
const CTG = () => window.CTG || {};

class Component extends DCLogic {
  state = {
    note: null, noteX: 0, noteY: 0,
    // 'analyze' | 'results' | 'pick-plate' | 'pick-read'
    view: 'results',
    analysisName: null,
    plateMapId: null, readId: null,
    pending: null, hoverId: null,
  };

  showNote = (e) => {
    const note = e.currentTarget.dataset.note;
    if (!note) return;
    this.setState({ note, noteX: e.clientX + 14, noteY: e.clientY + 18 });
  };
  moveNote = (e) => {
    if (!this.state.note) return;
    this.setState({ noteX: e.clientX + 14, noteY: e.clientY + 18 });
  };
  hideNote = () => this.setState({ note: null });

  _stamp() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    let h = d.getHours();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return 'CellTiter-Glo ' + d.getFullYear() + ' ' + p(d.getMonth() + 1) + ' ' + p(d.getDate())
         + ' ' + h + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + ' ' + ap + ' - Analysis';
  }

  componentDidMount() { this.setState({ analysisName: this._stamp() }); }

  _find(list, id) { return (list || []).find(x => x.id === id); }

  renderVals() {
    const s = this.state;
    const C = CTG();
    const view = s.view;
    const isList = view === 'results' || view === 'pick-plate' || view === 'pick-read';

    const ghostBtn = 'background:var(--pn-color-surface-default);border:1px solid var(--pn-color-border-default);'
      + 'border-radius:var(--pn-border-radius-md);padding:8px 12px;cursor:pointer;'
      + 'font:400 15px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);';
    const solid = (on) => `border:1px solid ${on ? 'var(--pn-color-sol-500)' : 'var(--pn-color-border-subtle)'};`
      + `background:${on ? 'var(--pn-color-sol-500)' : 'var(--pn-color-surface-sunken)'};`
      + `color:${on ? 'var(--pn-color-text-primary)' : 'var(--pn-color-text-disabled)'};`
      + `border-radius:var(--pn-border-radius-md);padding:8px 12px;`
      + `font:400 15px/1 var(--pn-font-family-sans);cursor:${on ? 'pointer' : 'default'};`;

    // Which list, which actions, which confirm label. One table rather than
    // three near-identical branches.
    const spec = {
      'results':    { rows: C.ANALYSES,        actions: C.ANALYSIS_ROW_ACTIONS,        label: 'View', appFilter: false, title: 'Analyze Data' },
      'pick-plate': { rows: C.PLATE_MAPS,      actions: C.PLATE_MAP_ROW_ACTIONS,       label: 'Next', appFilter: true,  title: 'Select Plate Map' },
      'pick-read':  { rows: C.INSTRUMENT_DATA, actions: C.INSTRUMENT_DATA_ROW_ACTIONS, label: 'Next', appFilter: true,  title: 'Select Instrument Data File' },
    }[view] || null;

    const ICON = 'width:24px;height:24px;padding:0;display:flex;align-items:center;justify-content:center;'
               + 'background:none;border:0;cursor:not-allowed;';
    const pinAction = (spec && spec.actions || []).find(a => a.key === 'pin') || {};
    const rows = !spec ? [] : (spec.rows || []).map(m => {
      const isSel = s.pending === m.id;
      return {
        name: m.name, date: m.date,
        pinNote: pinAction.note,
        pinned: !!m.pinned, notPinned: !m.pinned,
        // Pin renders as its own leading column, so only the remaining
        // actions go through the generic loop.
        actions: (spec.actions || []).filter(a => a.key !== 'pin').map(a => ({
          note: a.note, path: a.path, style: ICON,
          fill: 'none', stroke: 'var(--pn-color-text-muted)',
        })),
        radioStyle: 'width:22px;height:22px;border-radius:50%;padding:0;display:flex;align-items:center;'
          + 'justify-content:center;background:var(--pn-color-surface-default);cursor:pointer;border:2px solid '
          + (isSel ? 'var(--pn-color-sol-500)' : 'var(--pn-color-border-default)') + ';',
        radioDotStyle: 'width:10px;height:10px;border-radius:50%;display:block;background:'
          + (isSel ? 'var(--pn-color-sol-500)' : 'transparent') + ';',
        onSelect: () => this.setState({ pending: m.id }),
      };
    });

    const chosenMap  = this._find(C.PLATE_MAPS, s.plateMapId);
    const chosenRead = this._find(C.INSTRUMENT_DATA, s.readId);
    const bothChosen = !!(chosenMap && chosenRead);

    return {
      open: this.props.open !== false,
      note: s.note, noteX: s.noteX + 'px', noteY: s.noteY + 'px',
      showNote: this.showNote, moveNote: this.moveNote, hideNote: this.hideNote,
      ghostBtn,

      title: spec ? spec.title : 'Analyze Data',
      isMain: !spec || view === 'results',
      isAnalyzeTab: view === 'analyze',
      // The Analyze tab's content is shorter than the file-list views, so it
      // gets its own shorter modal instead of stretching to fill 840px.
      modalHeight: view === 'analyze' ? 'auto' : '840px',
      isList,
      tabAnalyzeCls: 'ad-tab' + (view === 'analyze' ? ' is-on' : ''),
      tabResultsCls: 'ad-tab' + (view === 'results' ? ' is-on' : ''),
      goAnalyze: () => this.setState({ view: 'analyze', pending: null }),
      goResults: () => this.setState({ view: 'results', pending: null }),

      analysisName: s.analysisName || '',
      noPlateMap: !chosenMap, hasPlateMap: !!chosenMap,
      noRead: !chosenRead,   hasRead: !!chosenRead,
      plateMapLabel: chosenMap ? chosenMap.name : 'Select Plate Map',
      readLabel: chosenRead ? chosenRead.name : 'Select Instrument Data File',
      openPlateMapPicker: () => this.setState({ view: 'pick-plate', pending: s.plateMapId }),
      openReadPicker:     () => this.setState({ view: 'pick-read',  pending: s.readId }),

      analyzeDisabled: !bothChosen,
      analyzeStyle: solid(bothChosen),
      // Stops here deliberately: Cate scoped this to the modals, so Analyze does
      // not run an analysis or land on results.
      onAnalyze: () => {
        if (!bothChosen) return;
        document.dispatchEvent(new CustomEvent('ctg:analyze-data-note', { detail: {
          title: 'Analyze',
          body: 'Analyze pairs the plate map with the instrument data file and produces an analysis, which then opens in Analysis Results.',
        }}));
      },
      onCancel: () => document.dispatchEvent(new CustomEvent('ctg:analyze-data-cancel')),

      // ---- list view ----
      rows,
      gridCols: '32px 32px 1fr 280px ' + (view === 'pick-read' ? '150px' : (view === 'results' ? '190px' : '220px')),
      // Keeps an icon-button click from also selecting the row it sits in.
      stop: (e) => e.stopPropagation(),
      showAppFilter: !!(spec && spec.appFilter),
      confirmLabel: spec ? spec.label : '',
      confirmDisabled: !s.pending,
      confirmStyle: solid(!!s.pending),
      onListCancel: () => (view === 'results'
        ? document.dispatchEvent(new CustomEvent('ctg:analyze-data-cancel'))
        : this.setState({ view: 'analyze', pending: null })),
      onListConfirm: () => {
        if (!s.pending) return;
        if (view === 'pick-plate') return this.setState({ plateMapId: s.pending, view: 'analyze', pending: null });
        if (view === 'pick-read')  return this.setState({ readId: s.pending,     view: 'analyze', pending: null });
        // View Analysis Results: the one place this modal does lead somewhere,
        // because the analysis screen already exists.
        window.location.href = 'ctg-analysis-results.dc.html';
      },
    };
  }
}
