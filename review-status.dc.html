<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The demo is hosted on a public URL because the survey audience cannot hold
     GitHub accounts. noindex is what keeps it out of search results; see the
     hosting note in cow3rk. Deliberately NOT paired with a robots.txt Disallow:
     blocking the fetch means the crawler never reads this tag, and a URL found
     elsewhere can still be listed. Let them fetch, and tell them not to index. -->
<meta name="robots" content="noindex, nofollow">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/colors_and_type.css">
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/styles.css">
  <link rel="stylesheet" href="pronect-demo.css">
  <style>
    body{margin:0;font-family:var(--pn-font-family-sans);}
    .ix-link{display:block;text-decoration:none;border:1px solid var(--pn-color-border-subtle);
      border-radius:var(--pn-border-radius-md);padding:14px 18px;background:#fff;}
    .ix-link:hover{background:var(--pn-color-surface-hover);border-color:var(--pn-color-border-default);}
  </style>
</helmet>

<!-- Internal review tracker. NOT the demo's entry point.
     ==========================================================================
     This is the old index.dc.html, kept alive under its own name once
     index.dc.html was reorganized into a guided path for Stephanie's China
     branch feedback (2026-09-16): group by Dashboards / CTG workflow / RPT
     workflow, starting each workflow at its guided first step, rather than
     listing every screen flatly.

     That flat, tagged list is still useful for tracking review status page by
     page, so it lives on here rather than being lost. Not linked from
     anywhere in the demo chrome - reach it by URL. -->
<div style="min-height:100vh;background:var(--pn-color-surface-page);padding:48px 32px;box-sizing:border-box;">
  <div style="max-width:1080px;margin:0 auto;">

    <p style="margin:0 0 8px;font:500 13px/1 var(--pn-font-family-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--pn-color-text-muted);">Review</p>
    <h1 style="margin:0 0 6px;font:600 32px/1.2 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">Review Status</h1>
    <p style="margin:0 0 36px;font:400 16px/1.5 var(--pn-font-family-sans);color:var(--pn-color-text-muted);max-width:60ch;">
      Every screen in the demo, tagged by review status. This is scaffolding for tracking progress, not the demo's entry point - that's <code>index.dc.html</code> now.
    </p>

    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
      <div style="margin-bottom:34px;">
        <h2 style="margin:0 0 4px;font:600 18px/1.3 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">{{ g.title }}</h2>
        <p style="margin:0 0 14px;font:400 14px/1.4 var(--pn-font-family-sans);color:var(--pn-color-text-muted);">{{ g.blurb }}</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;">
          <sc-for list="{{ g.links }}" as="l" hint-placeholder-count="5">
            <a class="ix-link" href="{{ l.href }}" style="background:{{ l.cardBg }};border-color:{{ l.cardBorder }};">
              <span style="display:inline-block;margin-bottom:6px;padding:2px 8px;border-radius:10px;font:600 11px/1.4 var(--pn-font-family-sans);letter-spacing:.03em;color:#fff;background:{{ l.tagBg }};">{{ l.tagLabel }}</span>
              <span style="display:block;font:500 15px/1.3 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">{{ l.name }}</span>
              <span style="display:block;margin-top:3px;font:400 13px/1.4 var(--pn-font-family-sans);color:var(--pn-color-text-muted);">{{ l.note }}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:900}}">
// Declared here rather than in ctg-demo-data.js: this is a list of screens, not
// demo content, and nothing else needs it. Move it out if a second screen ever
// wants the same list.
const GROUPS = [
  {
    title: 'Start here',
    blurb: 'The platform, above any one app.',
    links: [
      { name: 'Dashboard', href: 'user-dashboard.dc.html',
        note: 'Applications, My Data and Instruments', ready: true },
      { name: 'Instrument details', href: 'instrument-details.dc.html',
        note: 'Six tabs, including the telemetry chart. MyGlo - Analytical Lab', ready: true },
    ],
  },
  {
    title: 'CellTiter-Glo',
    blurb: 'The main path. Read a plate, build a plate map, see the analysis.',
    links: [
      { name: 'App home', href: 'ctg-app-home.dc.html',
        note: 'Read Plate and Analyze Data open as modals here', ready: true },
      { name: 'Create Plate Map', href: 'ctg-create-plate-map.dc.html',
        note: 'The editor. Auto-fill Demo Data fills the plate', ready: false },
      { name: 'Create Plate Map, guided', href: 'ctg-guided-plate-map.dc.html',
        note: 'View-only version used on the guided index - the real editor above stays for reference', ready: false },
      { name: 'Read in progress', href: 'ctg-read-in-progress.dc.html',
        note: 'Full plate read', ready: true },
      { name: 'Read in progress, from a plate map', href: 'ctg-read-in-progress.dc.html?from=platemap',
        note: 'Same screen, lands on Analysis Results instead', ready: false },
      { name: 'Read results', href: 'ctg-read-results.dc.html',
        note: 'Heat map from a full plate read', ready: true },
      { name: 'Analysis results', href: 'ctg-analysis-results.dc.html',
        note: 'Three tabs, the curves, and Detailed Data', ready: false },
    ],
  },
  {
    title: 'Read Plate Tool',
    blurb: 'The second app, showing the same instruments and data from elsewhere.',
    links: [
      { name: 'App home', href: 'rpt-home.dc.html', note: '', ready: false },
      { name: 'App home, guided', href: 'rpt-guided-home.dc.html',
        note: 'View-only version used on the guided index - the real editor above stays for reference', ready: false },
      { name: 'Read in progress', href: 'rpt-read-in-progress.dc.html',
        note: 'Endpoint read', ready: false },
      { name: 'Read in progress, time course', href: 'rpt-read-in-progress.dc.html?mode=timecourse&running=1',
        note: 'Starts the read on load', ready: false },
      { name: 'Results, endpoint', href: 'rpt-results.dc.html',
        note: 'Real BacTiter-Glo plate', ready: true },
      { name: 'Results, time course', href: 'rpt-results.dc.html?mode=timecourse',
        note: 'All 13 reads complete', ready: true },
      { name: 'Results, time course mid-run', href: 'rpt-results.dc.html?mode=timecourse&progress=6',
        note: 'Six of 13 reads done', ready: true },
    ],
  },
];

// Ready-for-review styling, applied per link in renderVals() rather than
// hardcoded per entry above, so the two-state look only has to be defined once.
const REVIEW_STATE = {
  true: { cardBg: '#e8f5e9', cardBorder: '#a5d6a7', tagBg: '#2e7d32', tagLabel: 'Ready to Review' },
  false: { cardBg: '#fff8e1', cardBorder: '#ffe082', tagBg: '#f9a825', tagLabel: 'In Progress' },
};

class Component extends DCLogic {
  renderVals() {
    const groups = GROUPS.map(g => ({
      ...g,
      links: g.links.map(l => ({ ...l, ...REVIEW_STATE[l.ready] })),
    }));
    return { groups };
  }

  // Same Foleon "Dynamic height" resize report as pronect-topbar.dc.html - this
  // page has no topbar to inherit it from, being deliberately outside the
  // product chrome, so it needs its own copy. Keep both in sync if the reporting
  // logic ever changes.
  componentDidMount() {
    let lastHeight = 0;
    this._reportHeight = () => {
      const h = document.documentElement.scrollHeight;
      if (h === lastHeight) return;
      lastHeight = h;
      window.parent.postMessage(
        JSON.stringify({ src: location.toString(), context: 'iframe.resize', height: h }),
        '*'
      );
    };
    this._resizeObserver = new ResizeObserver(this._reportHeight);
    this._resizeObserver.observe(document.documentElement);
  }
  componentWillUnmount() {
    if (this._resizeObserver) this._resizeObserver.disconnect();
  }
}
</script>
</body>
</html>
