<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The demo is hosted on a public URL because the survey audience cannot hold
     GitHub accounts. noindex is what keeps it out of search results; see the
     hosting note in cow3rk. Deliberately NOT paired with a robots.txt Disallow:
     blocking the fetch means the crawler never reads this tag, and a URL found
     elsewhere can still be listed. Let them fetch, and tell them not to index. -->
<meta name="robots" content="noindex, nofollow">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/colors_and_type.css">
  <link rel="stylesheet" href="pronect-demo.css">
  <script src="_ds/pronect-design-system-019e2872-abd6-7041-9e28-1108e10af511/_ds_bundle.js"></script>
</helmet>
  <aside style="width:100%;height:100%;background:var(--pn-color-surface-inverse);display:flex;flex-direction:column;color:var(--pn-color-text-inverse);">
    <div style="width:100%;height:clamp(45px,7vh,80px);display:flex;align-items:center;justify-content:center;overflow:hidden;">
      <a href="index.dc.html" style="width:100%;height:100%;display:block;">
        <img src="assets/logo-lockup.svg" alt="ProNect by Promega" style="width:100%;height:100%;object-fit:cover;display:block;">
      </a>
    </div>
    <nav style="display:flex;flex-direction:column;">
      <button onClick="{{ goDashboard }}" style="position:relative;height:clamp(80px,10vh,160px);width:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;background:transparent;padding:0;">
        <span style="position:absolute;left:0;top:0;bottom:0;width:2.8%;background:var(--pn-color-sol-500);opacity:1;"></span>
        <span style="display:flex;flex-direction:column;align-items:center;gap:clamp(6px,0.5vw,20px);opacity:1;">
          <img src="assets/icon-nav_dashboard.svg" alt="" style="width:clamp(32px,2vw,64px);height:clamp(32px,2vw,64px);display:block;">
          <span style="font:500 var(--pn-font-size-base)/24px var(--font-sans);color:var(--pn-color-text-inverse);">Dashboard</span>
        </span>
      </button>
      <button data-note="Resources opens the Resource Center, with support material for ProNect and MyGlo." onMouseEnter="{{ showNote }}" onMouseMove="{{ moveNote }}" onMouseLeave="{{ hideNote }}"
        style="position:relative;height:clamp(80px,10vh,160px);width:100%;display:flex;align-items:center;justify-content:center;cursor:not-allowed;border:0;background:transparent;padding:0;">
        <span style="position:absolute;left:0;top:0;bottom:0;width:2.8%;background:var(--pn-color-sol-500);opacity:0;"></span>
        <span style="display:flex;flex-direction:column;align-items:center;gap:clamp(6px,0.5vw,20px);opacity:.5;">
          <svg viewBox="0 0 24 24" fill="var(--pn-color-text-inverse)" style="width:clamp(32px,2vw,64px);height:clamp(32px,2vw,64px);display:block;"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9l-2.5-1.5L14 11V4h5v7z"/></svg>
          <span style="font:500 var(--pn-font-size-base)/24px var(--font-sans);color:var(--pn-color-text-inverse);">Resources</span>
        </span>
      </button>
      <button data-note="Settings opens your ProNect account settings." onMouseEnter="{{ showNote }}" onMouseMove="{{ moveNote }}" onMouseLeave="{{ hideNote }}"
        style="position:relative;height:clamp(80px,10vh,160px);width:100%;display:flex;align-items:center;justify-content:center;cursor:not-allowed;border:0;background:transparent;padding:0;">
        <span style="position:absolute;left:0;top:0;bottom:0;width:2.8%;background:var(--pn-color-sol-500);opacity:0;"></span>
        <span style="display:flex;flex-direction:column;align-items:center;gap:clamp(6px,0.5vw,20px);opacity:.5;">
          <img src="assets/icon-nav_settings.svg" alt="" style="width:clamp(32px,2vw,64px);height:clamp(32px,2vw,64px);display:block;">
          <span style="font:500 var(--pn-font-size-base)/24px var(--font-sans);color:var(--pn-color-text-inverse);">Settings</span>
        </span>
      </button>
    </nav>
  </aside>

  <sc-if value="{{ note }}">
    <div style="position:fixed;left:{{ noteX }};top:{{ noteY }};background:var(--pn-color-neutral-900);color:var(--pn-color-text-inverse);font:500 var(--pn-font-size-xs)/1.3 var(--pn-font-family-sans);padding:6px 10px;border-radius:6px;pointer-events:none;z-index:2000;box-shadow:var(--pn-shadow-xs);max-width:220px;">{{ note }}</div>
  </sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 284, &quot;height&quot;: 900},
  &quot;dashboardHref&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;section&quot;: &quot;Navigation&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
class Component extends DCLogic {
  // Own note state rather than the parent's. dc-import cannot pass callbacks down,
  // and the Luc EDIT_Plate-Map-Header sets the same precedent: a shared component
  // owns the state for its own hover notes.
  state = { note: null, noteX: 0, noteY: 0 };

  showNote = (e) => {
    const note = e.currentTarget.dataset.note;
    if (!note) return;
    this.setState({ note, noteX: e.clientX + 14, noteY: e.clientY + 18 });
  };
  moveNote = (e) => {
    if (!this.state.note) return;
    this.setState({ noteX: e.clientX + 14, noteY: e.clientY + 18 });
  };
  hideNote = () => this.setState({ note: null });

  // Empty dashboardHref means "this IS the dashboard", so the button does nothing.
  goDashboard = () => {
    const href = this.props.dashboardHref;
    if (href) window.location.href = href;
  };

  renderVals() {
    return {
      note: this.state.note,
      noteX: `${this.state.noteX}px`,
      noteY: `${this.state.noteY}px`,
      showNote: this.showNote,
      moveNote: this.moveNote,
      hideNote: this.hideNote,
      goDashboard: this.goDashboard,
    };
  }
}
</script>
</body>
</html>
