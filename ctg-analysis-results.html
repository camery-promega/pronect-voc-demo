  // ---- shared hover-note tooltip (dark, pre-line variant used on this page) ----
  let noteEl = null;
  function showNoteAt(text, x, y) {
    if (!text) return;
    if (!noteEl) {
      noteEl = document.createElement('div');
      noteEl.style.cssText = 'position:fixed;background:rgba(42,46,56,.9);color:var(--pn-color-text-inverse);font:400 var(--pn-font-size-xs)/1.4 var(--pn-font-family-sans);padding:10px 14px;border-radius:var(--pn-border-radius-sm);pointer-events:none;z-index:2000;box-shadow:0 4px 8px rgba(0,0,0,.4);max-width:320px;white-space:pre-line;';
      document.body.appendChild(noteEl);
    }
    noteEl.textContent = text;
    noteEl.style.left = (x + 16) + 'px';
    noteEl.style.top = (y + 18) + 'px';
  }
  function showNote(e) { showNoteAt(e.currentTarget.dataset.note, e.clientX, e.clientY); }

  // Colours are the design system's plate group tokens, not hand-picked hexes.
  const TOK = (n, fallback) => {
    const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    return v || fallback;
  };
  const SERIES = [
    { name: 'Bortezomib', color: TOK('--pn-color-plate-group-1', '#E68B50'), rows: ['G', 'H'] },
    { name: 'Panobinostat', color: TOK('--pn-color-plate-group-2', '#619CD1'), rows: ['E', 'F'] },
  ];

  const UNITS = [
    { label: 'M', shift: -6 },
    { label: 'mM', shift: -3 },
    { label: 'µM', shift: 0 },
    { label: 'nM', shift: 3 },
  ];

  const X0 = 74, X1 = 1174, Y0 = 14, Y1 = 450;
  const YD_TAB = { control: [0, 110], inhibition: [-10, 110] };
  const SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
                '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };

  // ---- state ----

  function sup(n) { return String(n).split('').map((c) => SUP[c] || c).join(''); }
  function sci(v, sig) {
    const exp = Math.floor(Math.log10(Math.abs(v)));
    const man = (v / Math.pow(10, exp)).toFixed(sig - 1);
    return man + ' × 10' + sup(exp);
  }
  function model_(f, conc) {
    const a = f.asym === undefined ? 1 : f.asym;
    return f.bottom + (f.top - f.bottom) / Math.pow(1 + Math.pow(conc / f.ec50, -f.hill), a);
  }
  function modality() { return tab === 'inhibition' ? '% Inhibition' : '% of Control'; }
  function shift() { return (UNITS.find((u) => u.label === unit) || UNITS[2]).shift; }
  function domain() {
    let lo = Infinity, hi = -Infinity;
    SERIES.forEach((s) => (D.points[s.name] || []).forEach((p) => {
      const l = Math.log10(p.x);
      if (l < lo) lo = l;
      if (l > hi) hi = l;

    const sh = shift();
    return [lo + sh - 0.12, hi + sh + 0.12];
  }

  }

    circle.addEventListener('mouseleave', () => {
      circle.setAttribute('r', 5);
      circle.setAttribute('fill', circle.dataset.color);
      circle.setAttribute('stroke', 'none');
      circle.setAttribute('stroke-width', 0);
      hideNote();
    });
  }

  function dotSvg(id, cx, cy, color, note) {
    return `<circle class="ar-pt" data-id="${id}" data-color="${color}" data-note="${note}" cx="${cx}" cy="${cy}" r="5" fill="${color}" stroke="none" stroke-width="0"></circle>`;
  }

  // ---- Standard curve ----
  function stdChart() {
    const XD = [0, 5.2], YDl = [0, 1.2e6];
    const sxl = (v) => X0 + (v - XD[0]) / (XD[1] - XD[0]) * (X1 - X0);
    const syl = (v) => Y1 - (v - YDl[0]) / (YDl[1] - YDl[0]) * (Y1 - Y0);
    const yTicks = [], xTicks = [];
    for (let v = 0; v <= YDl[1] + 1; v += 1e5) yTicks.push({ y: syl(v), ty: syl(v) + 7, label: fmtRLU(v) });
    for (let v = 0; v <= 5.0001; v += 0.5) xTicks.push({ x: sxl(v), label: v === 0 ? '0' : v.toFixed(1) });

    const slope = Q.eq.slope, inter = -Q.b * slope;
    const dotsHtml = [], barsHtml = [];
    Q.std.forEach((pt, i) => {
      const cx = sxl(pt.atp);
      if (stdErrorBars) {
        const id = 'std:' + i;
        const note = 'ATP: ' + pt.atp + ' µM\nAverage RLU: ' + Math.round(pt.mean).toLocaleString('en-US') + '\nStandard Deviation: ' + Number(pt.sd).toPrecision(4);
        dotsHtml.push(dotSvg(id, cx, syl(pt.mean), '#7BA7AE', note));
        const hiY = syl(Math.min(YDl[1], pt.mean + pt.sd)), loY = syl(Math.max(0, pt.mean - pt.sd));
        barsHtml.push(`<path d="M${cx - 6} ${hiY}H${cx + 6}M${cx} ${hiY}V${loY}M${cx - 6} ${loY}H${cx + 6}" stroke="var(--pn-color-neutral-900)" stroke-width="1.4" fill="none"></path>`);
      } else {
        pt.reps.forEach((v, ri) => {
          const id = 'std:' + i + ':' + ri;
          const note = 'ATP: ' + pt.atp + ' µM\nRLU: ' + Math.round(v).toLocaleString('en-US');
          dotsHtml.push(dotSvg(id, cx, syl(v), '#7BA7AE', note));
        });
      }
    });
    const yAt = (x) => Math.max(YDl[0], Math.min(YDl[1], slope * x + inter));

    const svg = `<svg viewBox="0 0 1180 520" style="width:100%;height:auto;display:block;overflow:visible;">
      ${yTicks.map((t) => `<line x1="66" x2="74" y1="${t.y}" y2="${t.y}" stroke="var(--pn-color-neutral-900)" stroke-width="1"></line><text x="58" y="${t.ty}" text-anchor="end" font-family="Roboto, sans-serif" font-size="19" fill="#141414">${t.label}</text>`).join('')}
      ${xTicks.map((t) => `<line y1="446" y2="454" x1="${t.x}" x2="${t.x}" stroke="var(--pn-color-neutral-900)" stroke-width="1"></line><text y="478" x="${t.x}" text-anchor="middle" font-family="Roboto, sans-serif" font-size="19" fill="#141414">${t.label}</text>`).join('')}
      <line x1="74" y1="14" x2="74" y2="450" stroke="var(--pn-color-neutral-900)" stroke-width="1.5"></line>
      <line x1="74" y1="450" x2="1174" y2="450" stroke="var(--pn-color-neutral-900)" stroke-width="1.5"></line>
      <path d="M${sxl(XD[0])} ${syl(yAt(XD[0]))}L${sxl(5.0)} ${syl(yAt(5.0))}" fill="none" stroke="#7BA7AE" stroke-width="2"></path>
      ${barsHtml.join('')}
      ${dotsHtml.join('')}
      <text x="24" y="232" text-anchor="middle" transform="rotate(-90 24 232)" font-family="Roboto, sans-serif" font-size="21" fill="#141414">Luminescence (RLU)</text>
    </svg>`;

    return { svg, equation: 'y=' + Math.trunc(slope) + 'x+' + Math.trunc(inter), r2: Q.eq.r2.toFixed(3), color: '#7BA7AE' };
  }

  // ---- Quantified values ----
  function quantChart(d, sh, visible, focus) {
    const YDl = [-0.5, 4.5];
    const syl = (v) => Y1 - (v - YDl[0]) / (YDl[1] - YDl[0]) * (Y1 - Y0);
    const yTicks = [];
    for (let v = YDl[0]; v <= YDl[1] + 1e-9; v += 0.5) yTicks.push({ y: syl(v), ty: syl(v) + 7, label: v === 0 ? '0' : v.toFixed(1) });
    const xTicks = [];
    for (let v = Math.ceil(d[0] * 2) / 2; v <= d[1]; v += 0.5) xTicks.push({ x: sx(v, d), label: v.toFixed(1) });

    const base = (D.fits[quantModel] || {})['% of Control'] || {};
    const xf = (f) => ({ ec50: f.ec50, r2: f.r2, hill: f.hill, asym: f.asym, top: Q.a * f.top + Q.b, bottom: Q.a * f.bottom + Q.b });

    const seriesHtml = [];
    const ecMarkers = [];
    visible.forEach((s) => {
      const f = xf(base[s.name]);
      const pts = Q.quant[s.name] || [];
      let curve = '';
      for (let i = 0; i <= 180; i++) {
        const lg = d[0] + (d[1] - d[0]) * i / 180;
        const y = Math.max(YDl[0], Math.min(YDl[1], model_(f, Math.pow(10, lg - sh))));
        curve += (i ? 'L' : 'M') + sx(lg, d).toFixed(1) + ' ' + syl(y).toFixed(1);
      }
      const dotsHtml = [], barsHtml = [];
      pts.forEach((p, ci) => {
        const cx = sx(Math.log10(p.x) + sh, d);
        if (focus) {
          (p.qr || []).forEach((val, ri) => {
            const id = 'q:' + s.name + ':' + ci + ':' + ri;
            const note = 'X: ' + sci(p.x, 4) + ' µM\nY: ' + val.toFixed(3) + '\nWell: ' + s.rows[ri] + (ci + 1);
            dotsHtml.push(dotSvg(id, cx, syl(val), s.color, note));
          });
        } else {
          const id = 'q:' + s.name + ':' + ci;
          const note = 'Average: ' + p.q.toFixed(3) + '\nStandard Deviation: ' + Number(p.qsd).toPrecision(4);
          dotsHtml.push(dotSvg(id, cx, syl(p.q), s.color, note));
          if (quantErrorBars) {
            const hiY = syl(Math.min(YDl[1], p.q + p.qsd)), loY = syl(Math.max(YDl[0], p.q - p.qsd));
            barsHtml.push(`<path d="M${cx - 6} ${hiY}H${cx + 6}M${cx} ${hiY}V${loY}M${cx - 6} ${loY}H${cx + 6}" stroke="var(--pn-color-neutral-900)" stroke-width="1.4" fill="none"></path>`);
          }
        }
      });
      const ecY = f.bottom + (f.top - f.bottom) / 2;
      const ecx = sx(Math.log10(f.ec50) + sh, d), ecy = syl(ecY);
      let ecNote = 'EC50 or IC50: ' + sci(f.ec50, 4) + ' µM\nTop: ' + Number(f.top).toPrecision(4) + '\nBottom: ' + Number(f.bottom).toPrecision(4) + '\nHill Slope: ' + f.hill.toFixed(3) + '\nR²: ' + f.r2.toFixed(4);
      if (f.asym !== undefined) ecNote += '\nAsymmetry Factor: ' + f.asym;
      ecMarkers.push({ cx: ecx, cy: ecy, color: s.color, note: ecNote });
      seriesHtml.push(`<path d="${curve}" fill="none" stroke="${s.color}" stroke-width="2.4"></path>${barsHtml.join('')}${dotsHtml.join('')}`);
    });

    const head = ['Name', 'EC₅₀ or IC₅₀', 'R²', 'Top', 'Bottom', 'Hill Slope'];
    if (quantModel === '5PL') head.push('Asymmetry Factor');
    const rows = SERIES.map((s) => {
      const f = xf(base[s.name]);
      const cells = [
        { text: sci(f.ec50, 4) + 'µM' },
        { text: f.r2.toFixed(4) },
        { text: Number(f.top).toPrecision(4) },
        { text: Number(f.bottom).toPrecision(4) },
        { text: f.hill.toFixed(3) },
      ];
      if (quantModel === '5PL') cells.push({ text: String(f.asym) });
      return { name: s.name, color: s.color, cells };
    });

    const ecHtml = ecMarkers.map((e, i) => `<circle class="ar-pt ar-ec" data-i="${i}" cx="${e.cx}" cy="${e.cy}" r="11" fill="var(--pn-color-surface-default)" fill-opacity="0.01" stroke="${e.color}" stroke-width="2.6"></circle>`).join('');

    const svg = `<svg viewBox="0 0 1180 520" style="width:100%;height:auto;display:block;overflow:visible;">
      ${yTicks.map((t) => `<line x1="66" x2="74" y1="${t.y}" y2="${t.y}" stroke="var(--pn-color-neutral-900)" stroke-width="1"></line><text x="58" y="${t.ty}" text-anchor="end" font-family="Roboto, sans-serif" font-size="19" fill="#141414">${t.label}</text>`).join('')}
      ${xTicks.map((t) => `<line y1="446" y2="454" x1="${t.x}" x2="${t.x}" stroke="var(--pn-color-neutral-900)" stroke-width="1"></line><text y="478" x="${t.x}" text-anchor="middle" font-family="Roboto, sans-serif" font-size="19" fill="#141414">${t.label}</text>`).join('')}
      <line x1="74" y1="14" x2="74" y2="450" stroke="var(--pn-color-neutral-900)" stroke-width="1.5"></line>
      <line x1="74" y1="${syl(0)}" x2="1174" y2="${syl(0)}" stroke="var(--pn-color-neutral-900)" stroke-width="1.5"></line>
      ${seriesHtml.join('')}
      ${ecHtml}
      <text x="24" y="232" text-anchor="middle" transform="rotate(-90 24 232)" font-family="Roboto, sans-serif" font-size="21" fill="#141414">ATP (µM)</text>
    </svg>`;

    return { svg, head: head.map((h) => ({ label: h })), rows, ecMarkers };
  }

  // ---- render: chart tab (Cell Viability) ----
  function renderChartTab() {
    const d = domain(), sh = shift();
    const mod = modality();
    const fits = (D.fits[model] || {})[mod] || {};
    const visible = SERIES.filter((s) => !hidden[s.name]);
    const focus = visible.length === 1;
    const meanKey = tab === 'inhibition' ? 'i' : 'v';
    const sdKey = tab === 'inhibition' ? 'isd' : 'vsd';
    const repKey = tab === 'inhibition' ? 'ir' : 'vr';

    const yTicks = [];
    const yd = ydOf();
    for (let v = yd[0]; v <= yd[1]; v += 10) yTicks.push({ y: sy(v), ty: sy(v) + 7, label: String(v) });
    const xTicks = [];
    for (let v = Math.ceil(d[0] * 2) / 2; v <= d[1]; v += 0.5) xTicks.push({ x: sx(v, d), label: v.toFixed(1) });

    const seriesHtml = [];
    const ecMarkers = [];
    visible.forEach((s) => {
      const f = fits[s.name];
      const pts = D.points[s.name] || [];
      let curve = '';
      for (let i = 0; i <= 180; i++) {
        const lg = d[0] + (d[1] - d[0]) * i / 180;
        const y = Math.max(yd[0], Math.min(yd[1], model_(f, Math.pow(10, lg - sh))));
        curve += (i ? 'L' : 'M') + sx(lg, d).toFixed(1) + ' ' + sy(y).toFixed(1);
      }
      const dotsHtml = [], barsHtml = [];
      pts.forEach((p, ci) => {
        const cx = sx(Math.log10(p.x) + sh, d);
        if (focus) {
          (p[repKey] || []).forEach((val, ri) => {
            const id = s.name + ':' + ci + ':' + ri;
            const well = s.rows[ri] + (ci + 1);
            const note = 'X: ' + sci(p.x, 4) + ' µM\nY: ' + val.toFixed(2) + '\nWell: ' + well;
            dotsHtml.push(dotSvg(id, cx, sy(val), s.color, note));
          });
        } else {
          const id = s.name + ':' + ci;
          const note = 'Average: ' + p[meanKey].toFixed(2) + '\nStandard Deviation: ' + Number(p[sdKey]).toPrecision(4);
          dotsHtml.push(dotSvg(id, cx, sy(p[meanKey]), s.color, note));
          if (errorBars) {
            const hiY = sy(Math.min(yd[1], p[meanKey] + p[sdKey]));
            const loY = sy(Math.max(yd[0], p[meanKey] - p[sdKey]));
            barsHtml.push(`<path d="M${cx - 6} ${hiY}H${cx + 6}M${cx} ${hiY}V${loY}M${cx - 6} ${loY}H${cx + 6}" stroke="var(--pn-color-neutral-900)" stroke-width="1.4" fill="none"></path>`);
          }

      });
      const ecY = f.bottom + (f.top - f.bottom) / 2;
      const ecx = sx(Math.log10(f.ec50) + sh, d), ecy = sy(ecY);
      let ecNote = 'EC50 or IC50: ' + sci(f.ec50, 4) + ' µM\nTop: ' + f.top.toFixed(1) + '\nBottom: ' + f.bottom.toFixed(4) + '\nHill Slope: ' + f.hill.toFixed(3) + '\nR²: ' + f.r2.toFixed(4);
      if (f.asym !== undefined) ecNote += '\nAsymmetry Factor: ' + f.asym;
      ecMarkers.push({ name: s.name, cx: ecx, cy: ecy, color: s.color, note: ecNote });
      seriesHtml.push(`<path d="${curve}" fill="none" stroke="${s.color}" stroke-width="2.4"></path>${barsHtml.join('')}${dotsHtml.join('')}`);
    });

    // crosshair follows the EC50 marker being hovered
    const cs = SERIES.find((s) => s.name === crossFor);
    const cf = cs && fits[cs.name];
    let crossHtml = '';
    if (cf) {
      const cy = cf.bottom + (cf.top - cf.bottom) / 2;
      const cxv = Math.log10(cf.ec50) + sh;
      const crossX = sx(cxv, d), crossY = sy(cy);
      const color = cs.color;
      crossHtml = `
        <line x1="74" x2="${crossX}" y1="${crossY}" y2="${crossY}" stroke="${color}" stroke-width="1.2" stroke-dasharray="5 4"></line>
        <line x1="${crossX}" x2="${crossX}" y1="${crossY}" y2="450" stroke="${color}" stroke-width="1.2" stroke-dasharray="5 4"></line>
        <rect x="14" y="${crossY - 12}" width="62" height="24" rx="3" fill="${color}"></rect>
        <text x="45" y="${crossY + 5}" text-anchor="middle" font-family="Roboto, sans-serif" font-size="15" fill="var(--pn-color-text-inverse)">${cy.toFixed(3)}</text>
        <rect x="${crossX - 31}" y="454" width="62" height="24" rx="3" fill="${color}"></rect>
        <text x="${crossX}" y="471" text-anchor="middle" font-family="Roboto, sans-serif" font-size="15" fill="var(--pn-color-text-inverse)">${cxv.toFixed(3)}</text>
      `;
    }

    const legendHtml = SERIES.map((s) => {
      const on = !hidden[s.name];
      const style = 'display:flex;align-items:center;gap:12px;padding:10px 18px;border-radius:var(--pn-border-radius-full);cursor:pointer;text-align:left;width:100%;'
        + (on ? 'background:var(--pn-color-surface-default);border:1px solid var(--pn-color-border-subtle);box-shadow:0 1px 4px rgba(0,0,0,.12);' : 'background:transparent;border:1px solid transparent;');
      return `<button class="ar-legend-btn" data-name="${s.name}" style="${style}"><span style="width:19px;height:19px;border-radius:50%;flex:none;background:${s.color};"></span><span style="font:400 21px/1.2 var(--pn-font-family-sans);color:#141414;">${s.name}</span></button>`;
    }).join('');

    const head = ['Name', 'EC₅₀ or IC₅₀', 'R²', 'Top', 'Bottom', 'Hill Slope'];
    if (model === '5PL') head.push('Asymmetry Factor');
    const tableRowsHtml = SERIES.map((s) => {
      const f = fits[s.name];
      const cells = [
        { text: sci(f.ec50, 4) + 'µM' },
        { text: f.r2.toFixed(4) },
        { text: f.top.toFixed(1) },
        { text: Number(f.bottom).toPrecision(4) },
        { text: f.hill.toFixed(3) },
      ];
      if (model === '5PL') cells.push({ text: String(f.asym) });
      return `<tr><td style="border:1px solid var(--pn-color-border-default);padding:12px 10px;"><span style="display:inline-flex;align-items:center;gap:8px;"><span style="width:11px;height:11px;border-radius:50%;background:${s.color};"></span>${s.name}</span></td>${cells.map((c) => `<td style="border:1px solid var(--pn-color-border-default);padding:12px 10px;text-align:center;color:#141414;">${c.text}</td>`).join('')}</tr>`;
    }).join('');

    const yAxisLabel = tab === 'inhibition' ? '% Inhibition' : '% of Control';
    const ecHtml = ecMarkers.map((e, i) => `<circle class="ar-pt ar-ec" data-i="${i}" cx="${e.cx}" cy="${e.cy}" r="11" fill="var(--pn-color-surface-default)" fill-opacity="0.01" stroke="${e.color}" stroke-width="2.6"></circle>`).join('');

    const el = document.getElementById('ar-chart-tab');
    el.innerHTML = `
      <div style="display:flex;align-items:flex-start;gap:16px;padding-top:16px;">
        <div style="flex:1;min-width:0;">
          <svg viewBox="0 0 1180 520" style="width:100%;height:auto;display:block;overflow:visible;">
            ${yTicks.map((t) => `<line x1="66" x2="74" y1="${t.y}" y2="${t.y}" stroke="var(--pn-color-neutral-900)" stroke-width="1"></line><text x="58" y="${t.ty}" text-anchor="end" font-family="Roboto, sans-serif" font-size="19" fill="#141414">${t.label}</text>`).join('')}
            ${xTicks.map((t) => `<line y1="446" y2="454" x1="${t.x}" x2="${t.x}" stroke="var(--pn-color-neutral-900)" stroke-width="1"></line><text y="478" x="${t.x}" text-anchor="middle" font-family="Roboto, sans-serif" font-size="19" fill="#141414">${t.label}</text>`).join('')}
            <line x1="74" y1="14" x2="74" y2="450" stroke="var(--pn-color-neutral-900)" stroke-width="1.5"></line>
            <line x1="74" y1="450" x2="1174" y2="450" stroke="var(--pn-color-neutral-900)" stroke-width="1.5"></line>
            ${crossHtml}
            ${seriesHtml.join('')}
            ${ecHtml}
            <text x="24" y="232" text-anchor="middle" transform="rotate(-90 24 232)" font-family="Roboto, sans-serif" font-size="21" fill="#141414">${yAxisLabel}</text>
          </svg>
          <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding-top:6px;">
            <span style="font:400 21px/1.2 var(--pn-font-family-sans);color:#141414;">Compound Concentration (log ${unit})</span>
            <button id="ar-unit-toggle-1" style="background:none;border:0;padding:4px;cursor:pointer;display:flex;">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--pn-color-neutral-900)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </div>
          <div id="ar-unit-menu-1" style="display:${unitMenuOpen ? 'flex' : 'none'};justify-content:center;"></div>
        </div>
        <div style="flex:none;width:200px;display:flex;flex-direction:column;gap:14px;padding-top:24px;">${legendHtml}</div>
      </div>
      <div style="padding-top:22px;overflow-x:auto;">
        <table style="border-collapse:collapse;width:100%;min-width:760px;font:400 15px/1.3 var(--pn-font-family-sans);">
          <tr>${head.map((h) => `<th style="border:1px solid var(--pn-color-border-default);padding:12px 10px;font-weight:700;color:#141414;">${h}</th>`).join('')}</tr>
          ${tableRowsHtml}
        </table>
      </div>
    `;

    el.querySelectorAll('.ar-pt').forEach((c) => { if (!c.classList.contains('ar-ec')) wireDot(c); });
    el.querySelectorAll('.ar-ec').forEach((circle) => {
      const marker = ecMarkers[Number(circle.dataset.i)];
      circle.addEventListener('mouseenter', (e) => { crossFor = marker.name; renderChartTab(); showNoteAt(marker.note, e.clientX, e.clientY); });
      circle.addEventListener('mousemove', moveNote);
      circle.addEventListener('mouseleave', () => { crossFor = null; renderChartTab(); hideNote(); });
    });
    document.getElementById('ar-unit-toggle-1').addEventListener('click', () => { unitMenuOpen = !unitMenuOpen; renderAll(); });
    renderUnitMenu(document.getElementById('ar-unit-menu-1'));
    el.querySelectorAll('.ar-legend-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const name = btn.dataset.name;
        if (!hidden[name] && SERIES.filter((x) => !hidden[x.name]).length === 1) return;
        hidden[name] = !hidden[name];
        crossFor = null;
        renderAll();
      });
    });
  }

  function renderChartControls() {
    const visible = SERIES.filter((s) => !hidden[s.name]);
    const focus = visible.length === 1;
    const controlsEl = document.getElementById('ar-chart-controls');
    if (tab === 'quantified') { controlsEl.innerHTML = ''; return; }
    controlsEl.innerHTML = `
      <span style="font:400 15px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);">Curve fit</span>
      <select id="ar-curve-fit" style="padding:8px 12px;border:1px solid var(--pn-color-border-default);border-radius:4px;background:var(--pn-color-surface-default);font:400 14px/1 var(--pn-font-family-sans);color:var(--pn-color-text-primary);cursor:pointer;">
        <option value="4PL" ${model === '4PL' ? 'selected' : ''}>4PL</option>
        <option value="5PL" ${model === '5PL' ? 'selected' : ''}>5PL</option>
      </select>
      <label style="display:flex;align-items:center;gap:8px;cursor:${focus ? 'not-allowed' : 'pointer'};font:400 15px/1 var(--pn-font-family-sans);color:${focus ? 'var(--pn-color-text-muted)' : 'var(--pn-color-text-primary)'};">
        <input type="checkbox" id="ar-error-bars" ${errorBars && !focus ? 'checked' : ''} ${focus ? 'disabled' : ''} style="width:17px;height:17px;accent-color:var(--pn-color-sol-500);cursor:${focus ? 'not-allowed' : 'pointer'};">
        Show Error Bars
      </label>
    `;
    document.getElementById('ar-curve-fit').addEventListener('change', (e) => { model = e.target.value; crossFor = null; renderAll(); });
    const ebEl = document.getElementById('ar-error-bars');
    if (ebEl) ebEl.addEventListener('change', (e) => { errorBars = e.target.checked; renderChartTab(); });
  }

  function renderTabs() {
    document.querySelectorAll('.ar-tab-btn').forEach((btn) => {
      btn.style.cssText = tabStyle(btn.dataset.tab === tab);
      btn.onclick = () => { tab = btn.dataset.tab; hideNote(); renderAll(); };
    });
  }

  function renderAll() {
    renderTabs();
    renderChartControls();
    const isChartTab = tab !== 'quantified';
    document.getElementById('ar-chart-tab').style.display = isChartTab ? 'block' : 'none';
    document.getElementById('ar-placeholder-tab').style.display = isChartTab ? 'none' : 'block';
    if (isChartTab) renderChartTab();
    else renderPlaceholderTab();
  }

  renderAll();
</script>
</body>
</html>
